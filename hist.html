let si = D.sessions.length - 1, fi = null;

function unitsOn(f){ return D.units.filter(u=>u.f===f); }
function ctr(u){ return [(u.x+u.w/2)*D.CELL, (u.y+u.h/2)*D.CELL]; }
function findUnit(f,t,no){ return D.units.find(u=>u.f===f&&u.t===t&&u.no===no); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function fitBox(f){
  const us = unitsOn(f);
  if(!us.length) return [0,0,960,720];
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  us.forEach(u=>{ x1=Math.min(x1,u.x); y1=Math.min(y1,u.y); x2=Math.max(x2,u.x+u.w); y2=Math.max(y2,u.y+u.h); });
  const pad=2;
  x1=(x1-pad)*D.CELL; y1=(y1-pad)*D.CELL; x2=(x2+pad)*D.CELL; y2=(y2+pad)*D.CELL;
  let w=x2-x1, h=y2-y1;
  const want=960/720;
  if(w/h < want){ const nw=h*want; x1-=(nw-w)/2; w=nw; } else { const nh=w/want; y1-=(nh-h)/2; h=nh; }
  return [Math.round(x1),Math.round(y1),Math.round(w),Math.round(h)];
}

function render(){
  const S = D.sessions[si];
  document.getElementById('ses').innerHTML = D.sessions.map((s,i)=>
    '<button class="chip'+(i===si?' on':'')+'" onclick="si='+i+';fi=null;render()">'+esc(s.label)
    +' <i>'+s.stops.length+'곳</i></button>').join('');

  document.getElementById('sum').innerHTML =
    '<b>'+S.stops.length+'자리 · '+S.lines+'줄</b> &nbsp; 층이동 '+(S.legs.length-1)+'회 &nbsp; 같은자리 재방문 '
    + (S.rev ? '<b>'+S.rev+'회</b>' : '0회')
    + '<br><span style="color:var(--text-2)">'+S.legs.map(l=>esc(l[0])+' '+l[1]+'곳').join(' &nbsp;→&nbsp; ')+'</span>';

  const fl = D.floors.filter(f=> S.stops.some(s=>s.f===f));
  if(fi===null || !fl.includes(fi)) fi = (S.stops.find(s=>findUnit(s.f,s.ut,s.uno))||S.stops[0]).f;
  document.getElementById('fls').innerHTML = fl.map(f=>
    '<button class="chip'+(f===fi?' on':'')+'" onclick="fi=\''+f+'\';render()">'+esc(f)
    +' <i>'+S.stops.filter(s=>s.f===f).length+'곳</i></button>').join('');

  // 지도
  const svg = document.getElementById('map');
  svg.setAttribute('viewBox', fitBox(fi).join(' '));
  let p = '';
  unitsOn(fi).forEach(u=>{
    const X=u.x*D.CELL, Y=u.y*D.CELL, W=u.w*D.CELL, H=u.h*D.CELL;
    p += '<rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" rx="3" fill="'+(D.FILL[u.t]||'#eee')
      +'" stroke="'+(D.LINE[u.t]||'#999')+'" stroke-width="1.5"/>';
    const cx=X+W/2, cy=Y+H/2, vert=H>W*1.6;
    const fs=Math.max(9,Math.min(14,Math.min(W,H)*0.5));
    p += '<text x="'+cx+'" y="'+cy+'" font-size="'+fs+'" font-weight="700" fill="'+(D.LINE[u.t]||'#999')
      +'" text-anchor="middle" dominant-baseline="central"'
      +(vert?' transform="rotate(-90 '+cx+' '+cy+')"':'')+'>'+esc(u.t==='계단'?'계단':u.no)+'</text>';
  });
  const here = S.stops.filter(s=>s.f===fi && findUnit(s.f,s.ut,s.uno));
  const pts = here.map(s=>ctr(findUnit(s.f,s.ut,s.uno)));
  if(pts.length>1)
    p += '<polyline points="'+pts.map(q=>q[0]+','+q[1]).join(' ')+'" fill="none" stroke="#C96442" '
      +'stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".45"/>';
  here.forEach((s,i)=>{
    const q=pts[i], first=i===0;
    p += '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="13" fill="'+(first?'#C96442':'#fff')
      +'" stroke="#C96442" stroke-width="2.2"/>'
      +'<text x="'+q[0]+'" y="'+q[1]+'" font-size="12" font-weight="700" text-anchor="middle" '
      +'dominant-baseline="central" fill="'+(first?'#fff':'#C96442')+'">'+s.n+'</text>';
  });
  svg.innerHTML = p;

  // 목록 (전체 순서, 이 층은 진하게)
  const cnt = {};
  S.stops.forEach(s=>{ const k=s.f+s.ut+s.uno; cnt[k]=(cnt[k]||0)+1; });
  document.getElementById('list').innerHTML = S.stops.map(s=>{
    const k=s.f+s.ut+s.uno, dup=cnt[k]>1, on=s.f===fi;
    return '<div class="row" style="opacity:'+(on?1:.42)+'">'
      +'<div class="num'+(on?'':' dim')+'">'+s.n+'</div>'
      +'<div><div class="loc">'+esc(s.f+' '+s.ut+' '+s.uno)
      + (dup?'<span class="warn">재방문</span>':'')
      + '<span class="tag">'+esc(s.ords.join(','))+'</span></div>'
      +'<div class="nm">'+esc(s.items.slice(0,3).join(' · '))+(s.items.length>3?' 외 '+(s.items.length-3):'')+'</div></div>'
      +'<div class="q">'+s.q+'</div></div>';
  }).join('');
}
render();
