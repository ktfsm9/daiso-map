<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>다이소 피킹</title>
<style>
:root{--bg:#FAF9F5;--surface:#fff;--text:#1F1E1D;--text-2:#5A584F;--border:#E5E2D9;
  --accent:#C96442;--accent-strong:#A94E30;--no:#B4453A;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;padding:22px}
.box{width:100%;max-width:360px;text-align:center}
h1{font-size:23px;margin:0 0 6px}
p{color:var(--text-2);font-size:14px;line-height:1.6;margin:0 0 20px}
input{width:100%;padding:15px;font-size:19px;text-align:center;border:1.5px solid var(--border);
  border-radius:var(--r);background:var(--surface);color:var(--text);letter-spacing:.05em}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:11px;padding:15px;font-size:16px;font-weight:700;border:none;
  border-radius:var(--r);background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:13px;font-size:13px;min-height:19px;color:var(--no)}
.ver{margin-top:26px;font-size:11px;color:#A8A69C}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=s=>document.querySelector(s);

async function unlock(pw, quiet){
  if(!pw) return false;
  if(!(window.crypto && crypto.subtle)){
    $('#msg').textContent='이 주소에서는 잠금 해제가 안 됩니다. https 주소로 열어주세요.';
    return false;
  }
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(SALT), iterations:200000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(DATA));
    const html = new TextDecoder().decode(out);
    try{ localStorage.setItem(KEY, pw); }catch(e){}
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){
    if(!quiet){ $('#msg').textContent='암호가 맞지 않습니다'; }
    try{ localStorage.removeItem(KEY); }catch(e2){}
    return false;
  }
}
$('#go').onclick = async ()=>{
  $('#go').disabled = true; $('#msg').textContent = '여는 중…';
  if(!await unlock($('#pw').value.trim())) $('#go').disabled = false;
};
$('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#go').click(); });
(async ()=>{
  let saved = null; try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved && await unlock(saved, true)) return;
  $('#pw').focus();
})();
</script>
