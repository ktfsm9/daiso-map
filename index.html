<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="피킹">
<title>다이소 피킹</title>
<style>
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --surface-2:#F0EEE6; --surface-3:#E8E5DA;
  --border:#E5E2D9; --border-strong:#D6D2C4;
  --text:#1F1E1D; --text-2:#5C5B57; --text-3:#8C8A82;
  --accent:#C96442; --accent-soft:#F5E9E4; --accent-strong:#A94F32;
  --ok:#3F7D58; --ok-soft:#E6F0E9;
  --no:#B4453A; --no-soft:#F8E7E5;
  --gondola:#7C6BAF; --gondola-bg:#EDEAF6;
  --wall:#2F7DA8; --wall-bg:#E4F0F6;
  --store:#B07A2F; --store-bg:#F7EEDD;
  --cash:#3F7D58; --cash-bg:#E6F0E9;
  --stair:#6B6A65; --stair-bg:#EAE8E0;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overscroll-behavior:none}
.app{flex:1;display:flex;flex-direction:column;max-width:620px;width:100%;margin:0 auto;min-height:0}
.view{display:none;flex:1;flex-direction:column;min-height:0;padding:0 16px}
.view.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding-bottom:20px}
.head{padding:13px 0 9px;display:flex;align-items:center;gap:10px;min-height:54px}
.head h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.02em}
.head .sub{font-size:12.5px;color:var(--text-3);margin-top:1px}
.grow{flex:1}
.tabs{display:flex;border-top:1px solid var(--border);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0;z-index:40}
.tab{flex:1;border:none;background:none;padding:9px 4px 8px;font-family:inherit;font-size:11px;color:var(--text-3);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;position:relative}
.tab svg{width:22px;height:22px;stroke-width:1.7;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab .n{position:absolute;top:4px;right:calc(50% - 22px);background:var(--accent);color:#fff;font-size:10px;
  min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}

input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:11px;padding:12px 13px;width:100%;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none;border-color:var(--accent)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238C8A82' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:12.5px;color:var(--text-3);margin-bottom:5px;font-weight:500}
.row{display:flex;gap:9px}.row > *{flex:1}
.btn{border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:.13s;letter-spacing:-.01em;width:100%}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:active{background:var(--accent-strong)}
.btn.big{padding:18px;font-size:17px;border-radius:14px}
.btn.gh{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.btn.gh:active{background:var(--surface-2)}
.btn.dg{background:var(--no-soft);color:var(--no)}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);border-radius:999px;
  padding:7px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card h3{margin:0 0 11px;font-size:12.5px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.muted{color:var(--text-3);font-size:13px;line-height:1.65}
.empty{text-align:center;padding:38px 20px;color:var(--text-3);font-size:14px;line-height:1.7}
.empty b{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:6px}
.lb{font-size:14px;font-weight:700;padding:4px 9px;border-radius:8px;font-variant-numeric:tabular-nums;display:inline-block}
.lb.f{background:var(--surface-3);color:var(--text)}
.lb.곤도라{background:var(--gondola-bg);color:var(--gondola)}
.lb.벽면{background:var(--wall-bg);color:var(--wall)}
.lb.창고{background:var(--store-bg);color:var(--store)}
.lb.계산대{background:var(--cash-bg);color:var(--cash)}
.lb.계단{background:var(--stair-bg);color:var(--stair)}
.lb.t{background:var(--accent-soft);color:var(--accent-strong)}

/* ---- 피킹 ---- */
.prog{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.dest{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:11px}
.dest .step{font-size:11.5px;letter-spacing:.08em;color:var(--text-3);font-weight:700;margin-bottom:9px}
.dest .big{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.dest .big em{font-style:normal;color:var(--text-3);font-weight:600;font-size:22px}
.dest .walk{font-size:13px;color:var(--text-3);margin-top:7px}
.picks{margin-top:15px}
.pk{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1.5px solid var(--border);
  border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.pk:active{background:var(--surface-2)}
.pk.done{background:var(--ok-soft);border-color:var(--ok)}
.pk .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--border-strong);flex:none;
  display:grid;place-items:center;margin-top:1px;font-size:15px;color:transparent}
.pk.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.pk .m{flex:1;min-width:0}
.pk .nm{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.pk.done .nm{text-decoration:line-through;opacity:.6}
.pk .sub{font-size:12px;color:var(--text-3);margin-top:3px;font-variant-numeric:tabular-nums}
.pk .qty{flex:none;font-size:19px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:1px}
.pk.done .qty{color:var(--ok)}
.tierbadge{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-strong);
  padding:2px 7px;border-radius:6px;margin-right:6px}
.upnext{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.upnext .u{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:7px 10px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.upnext .u.f{border-color:var(--border-strong);background:var(--surface-2);font-weight:600}
svg.plan{display:block;width:100%;background:var(--surface);touch-action:none}
.plancard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:11px}
.planbar{display:flex;align-items:center;gap:7px;padding:9px 11px;border-top:1px solid var(--border);background:var(--surface-2)}
.zoom{width:34px;height:34px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);
  font-size:17px;cursor:pointer;color:var(--text-2);font-family:inherit;flex:none;display:grid;place-items:center}
.tool{flex:1;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:8px 3px;
  font-size:11.5px;font-family:inherit;cursor:pointer;color:var(--text-2);font-weight:600}
.tool.on{color:#fff}
.tool.on[data-t="선택"]{background:var(--text);border-color:var(--text)}
.tool.on[data-t="곤도라"]{background:var(--gondola);border-color:var(--gondola)}
.tool.on[data-t="벽면"]{background:var(--wall);border-color:var(--wall)}
.tool.on[data-t="창고"]{background:var(--store);border-color:var(--store)}
.tool.on[data-t="계산대"]{background:var(--cash);border-color:var(--cash)}
.tool.on[data-t="계단"]{background:var(--stair);border-color:var(--stair)}
.stepper{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{width:42px;height:44px;border:none;background:var(--surface);font-size:19px;color:var(--text-2);cursor:pointer;font-family:inherit;flex:none}
.stepper button:active{background:var(--surface-2)}
.stepper .v{flex:1;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:180px;margin:0 auto}
.pad button{height:40px;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;font-size:15px;color:var(--text-2);cursor:pointer;font-family:inherit}
.pad .sp{visibility:hidden}
.mask{position:fixed;inset:0;background:rgba(31,30,29,.32);z-index:60;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.22,1,.36,1);max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;background:var(--border-strong);border-radius:9px;margin:6px auto 14px}
.sheet h2{font-size:17px;margin:0 0 4px;font-weight:600}
.sheet .sh-sub{font-size:13px;color:var(--text-3);margin:0 0 15px}
.itm{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.itm:last-child{border-bottom:none}
.itm .txt{flex:1;min-width:0}
.itm .nm{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itm .mt{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:2px}
.itm .act{flex:none;border:1px solid var(--border-strong);color:var(--text-2);background:var(--surface);
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.toast{position:fixed;left:16px;right:16px;bottom:80px;z-index:70;background:var(--text);color:#fff;border-radius:12px;
  padding:12px 15px;font-size:13.5px;display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto;
  opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{margin-left:auto;background:none;border:none;color:#F0B49A;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;flex:none}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-3);font-weight:600}
.badge.ac{background:var(--accent-soft);color:var(--accent-strong)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
td.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.big-in{font-size:26px;font-weight:700;text-align:center;letter-spacing:.06em;padding:15px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">

<!-- ============ 피킹 ============ -->
<section id="v-pick" class="view on">
  <div class="head">
    <div><h1 id="pick-h">피킹</h1><div class="sub" id="pick-sub"></div></div>
    <div class="grow"></div>
    <button class="btn gh sm" id="pick-list" style="width:auto">남은 목록</button>
  </div>
  <div class="prog"><i id="pick-prog" style="width:0%"></i></div>
  <div class="scroll" id="pick-body"></div>
</section>

<!-- ============ 주문 ============ -->
<section id="v-order" class="view">
  <div class="head">
    <div><h1>주문 담기</h1><div class="sub" id="ord-sub"></div></div>
    <div class="grow"></div>
    <button class="btn gh sm" id="ord-new" style="width:auto">+ 주문서</button>
  </div>
  <div class="chips" id="ord-sess" style="margin-bottom:11px"></div>
  <div class="scroll" id="ord-body"></div>
</section>

<!-- ============ 평면도 ============ -->
<section id="v-plan" class="view">
  <div class="head">
    <div><h1>평면도</h1><div class="sub" id="plan-sub"></div></div>
    <div class="grow"></div>
    <button class="btn gh sm" id="plan-mode" style="width:auto">편집</button>
  </div>
  <div class="chips" id="plan-floors" style="margin-bottom:11px"></div>
  <div class="scroll">
    <div class="plancard">
      <svg class="plan" id="svg" viewBox="0 0 960 720" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="planbar">
        <button class="zoom" id="z-out">&minus;</button>
        <button class="zoom" id="z-in">+</button>
        <button class="zoom" id="z-fit" style="font-size:12px;font-weight:600;width:auto;padding:0 11px">전체</button>
        <div class="grow"></div><span class="muted" id="plan-hint"></span>
      </div>
      <div class="planbar" id="toolbar" style="display:none">
        <button class="tool on" data-t="선택">선택</button>
        <button class="tool" data-t="곤도라">곤도라</button>
        <button class="tool" data-t="벽면">벽면</button>
        <button class="tool" data-t="창고">창고</button>
        <button class="tool" data-t="계산대">계산대</button>
        <button class="tool" data-t="계단">계단</button>
      </div>
      <div class="planbar" id="numbar" style="display:none">
        <span class="muted" style="flex:none">다음 번호</span>
        <button class="zoom" id="n-dn">&minus;</button>
        <input id="n-val" inputmode="numeric" maxlength="6"
          style="width:74px;flex:none;text-align:center;font-weight:700;font-size:16px;padding:7px 4px;
                 font-variant-numeric:tabular-nums">
        <button class="zoom" id="n-up">+</button>
        <span class="muted" style="flex:1;text-align:right;line-height:1.3">톡 누르면 놓기<br>끌면 크기 지정</span>
      </div>
    </div>
    <div id="plan-legend"></div>
  </div>
</section>

<!-- ============ 상품 ============ -->
<section id="v-cat" class="view">
  <div class="head">
    <div><h1>상품</h1><div class="sub" id="cat-sub"></div></div>
    <div class="grow"></div>
    <button class="btn pri sm" id="cat-add" style="width:auto">+ 추가</button>
  </div>
  <input type="search" id="cq" placeholder="상품명 또는 코드" autocomplete="off" style="margin-bottom:10px">
  <div class="chips" id="cat-chips" style="margin-bottom:11px"></div>
  <div class="scroll" id="cat-body"></div>
</section>

<!-- ============ 설정 ============ -->
<section id="v-set" class="view">
  <div class="head"><div><h1>설정</h1><div class="sub">시간대와 백업</div></div></div>
  <div class="scroll">
    <div class="card"><h3>현황</h3><table id="set-stat"></table></div>
    <div class="card">
      <h3>포장 시간대</h3>
      <div class="row" style="margin-bottom:9px">
        <label class="fld" style="margin:0"><span>오전 시작</span><input id="t-am1" type="time"></label>
        <label class="fld" style="margin:0"><span>오전 마감</span><input id="t-am2" type="time"></label>
      </div>
      <div class="row">
        <label class="fld" style="margin:0"><span>오후 시작</span><input id="t-pm1" type="time"></label>
        <label class="fld" style="margin:0"><span>오후 마감</span><input id="t-pm2" type="time"></label>
      </div>
      <p class="muted" style="margin:11px 0 0">마감 시각을 넘겨도 계속 쓸 수 있습니다. 남은 시간만 안내합니다.</p>
    </div>
    <div class="card">
      <h3>백업</h3>
      <p class="muted" style="margin:0 0 12px">평면도·상품·주문은 이 기기의 브라우저에만 저장됩니다.
        기기를 바꾸거나 사용 기록을 지우면 사라지니 가끔 내려받아 두세요.</p>
      <button class="btn gh" id="exp" style="margin-bottom:9px">백업 파일 내려받기</button>
      <button class="btn gh" id="imp-btn">백업 파일 불러오기</button>
      <input type="file" id="imp" accept=".json,application/json" style="display:none">
    </div>
    <div class="card">
      <h3>지난 주문 정리</h3>
      <p class="muted" style="margin:0 0 11px">완료된 주문서를 목록에서 치웁니다. 상품 카탈로그는 그대로 남습니다.</p>
      <button class="btn gh" id="clear-done">완료된 주문 비우기</button>
    </div>
    <div class="card">
      <h3>층 관리</h3>
      <div id="floor-mgr"></div>
      <div class="row" style="margin-top:10px">
        <input id="new-floor" placeholder="예: 3F" maxlength="6">
        <button class="btn gh" id="add-floor" style="flex:0 0 90px">추가</button>
      </div>
    </div>
    <div class="card">
      <h3>전체 삭제</h3>
      <p class="muted" style="margin:0 0 11px">평면도·상품·주문을 모두 지웁니다. 먼저 백업하세요.</p>
      <button class="btn dg" id="wipe">모두 지우기</button>
    </div>
    <p class="muted" style="text-align:center;padding:6px 0 10px">다이소 구의역점 · 피킹</p>
  </div>
</section>

<nav class="tabs">
  <button class="tab on" data-v="v-pick"><svg viewBox="0 0 24 24"><path d="M3 6h2l2.5 10.5a2 2 0 0 0 2 1.5h7a2 2 0 0 0 2-1.5L20 9H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>피킹<span class="n" id="tab-n" style="display:none">0</span></button>
  <button class="tab" data-v="v-order"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>주문</button>
  <button class="tab" data-v="v-plan"><svg viewBox="0 0 24 24"><path d="M3 5.5 9 3l6 2.5L21 3v15.5L15 21l-6-2.5L3 21z"/><path d="M9 3v15.5M15 5.5V21"/></svg>평면도</button>
  <button class="tab" data-v="v-cat"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9h10M7 13h7"/></svg>상품</button>
  <button class="tab" data-v="v-set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>설정</button>
</nav>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-act">되돌리기</button></div>

<script>
/* ==================== 상수 ==================== */
const KEY = 'daiso_pick_v1', OLDKEY = 'daiso_map_v1';
const TYPES = ['곤도라','벽면','창고','계산대','계단'];
const LOC_TYPES = ['곤도라','벽면','창고','계산대'];
const DEF = { w:{곤도라:1,벽면:1,창고:3,계산대:2,계단:2}, h:{곤도라:4,벽면:5,창고:3,계산대:2,계단:2},
              tiers:{곤도라:5,벽면:5,창고:4,계산대:1,계단:1} };
const COLS = 48, ROWS = 36, CELL = 20;
const FILL = {곤도라:'#EDEAF6',벽면:'#E4F0F6',창고:'#F7EEDD',계산대:'#E6F0E9',계단:'#EAE8E0'};
const LINE = {곤도라:'#7C6BAF',벽면:'#2F7DA8',창고:'#B07A2F',계산대:'#3F7D58',계단:'#6B6A65'};

/* ==================== 저장소 ==================== */
let S = load();
function blank(){
  return { v:1, floors:['B1','1F','1.5F','2F'], units:[], cat:{}, orders:[],
           cur:{f:'1F'}, times:{am:['10:00','13:30'], pm:['15:00','18:30']}, ui:{floor:'1F'} };
}
function load(){
  try{ const o = JSON.parse(localStorage.getItem(KEY)); if(o && o.cat) return fill(o); }catch(e){}
  // 이전 버전(매대 지도)에서 평면도와 상품을 물려받는다
  try{
    const old = JSON.parse(localStorage.getItem(OLDKEY));
    if(old && old.units){
      const b = blank();
      b.floors = old.floors || b.floors;
      b.units = old.units;
      (old.items||[]).forEach(it=>{ if(it.code) b.cat[it.code] = {n:it.name, f:it.f, ut:it.ut, uno:it.uno, ti:it.tier||0}; });
      return b;
    }
  }catch(e){}
  return blank();
}
function fill(o){
  const b = blank();
  for(const k in b) if(o[k] === undefined) o[k] = b[k];
  o.times = o.times || b.times;
  o.cur = o.cur || b.cur;
  return o;
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast('저장 공간이 부족합니다. 백업 후 정리해 주세요.'); } }, 60);
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ==================== 유틸 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad3 = n => String(n).padStart(3,'0');
const pad2 = n => String(n).padStart(2,'0');
function unitAt(f,t,no){ return S.units.find(u=>u.f===f&&u.t===t&&u.no===no); }
function unitsOn(f){ return S.units.filter(u=>u.f===f); }
function ctr(u){ return [(u.x+u.w/2)*CELL, (u.y+u.h/2)*CELL]; }
function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function locOf(code){ const c = S.cat[code]; return c && c.uno ? c : null; }
function locStr(c){ return c && c.uno ? c.f+'-'+c.ut+'-'+c.uno+(c.ti?'-'+pad2(c.ti):'') : '위치 미지정'; }
const ABBR = {곤도라:'곤', 벽면:'벽', 창고:'창', 계산대:'계', 계단:'단'};
function abbr(t){ return ABBR[t] || ''; }

let toastT=null, toastFn=null;
function toast(msg, label, fn){
  $('#toast-msg').textContent = msg;
  const b = $('#toast-act');
  b.style.display = fn ? '' : 'none'; b.textContent = label || '되돌리기';
  toastFn = fn || null;
  $('#toast').classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>$('#toast').classList.remove('on'), fn?6000:2400);
}
$('#toast-act').onclick = ()=>{ if(toastFn) toastFn(); $('#toast').classList.remove('on'); };
function sheet(html){ $('#sheet-body').innerHTML = html; $('#mask').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#mask').classList.remove('on'); }
$('#mask').onclick = closeSheet;

/* ==================== 세션 ==================== */
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function hm(s){ const [h,m]=s.split(':').map(Number); return h*60+m; }
function curSession(){
  const n = nowMin();
  if(n < hm(S.times.am[1]) + 30) return 'am';
  return 'pm';
}
let sess = curSession();
function sessLabel(s){ return s==='am' ? '오전' : '오후'; }
function deadline(s){ return hm(S.times[s][1]); }
function dur(m){
  const h = Math.floor(m/60), r = m%60;
  return ((h ? h+'시간 ' : '') + (r || !h ? r+'분' : '')).trim();
}
function leftText(){
  const d = deadline(sess) - nowMin();
  return d < 0 ? '마감 ' + dur(-d) + ' 지남' : '마감까지 ' + dur(d);
}

/* ==================== 주문 ==================== */
function sessOrders(){ return S.orders.filter(o=>o.s===sess); }
function allLines(){
  const out = [];
  sessOrders().forEach(o => o.l.forEach((ln,i)=> out.push({o, ln, i})));
  return out;
}
function remaining(){ return allLines().filter(x=>!x.ln.d); }
function totalQty(list){ return list.reduce((a,x)=> a + (x.ln.q||1), 0); }

/* ==================== 동선 엔진 ==================== */
/* 남은 라인을 매대 단위로 묶고, 층은 한 번씩만 방문하도록 순서를 잡는다.
   층 내부는 최근접이웃 + 2-opt 로 개선한다. */
function buildRoute(){
  const rem = remaining();
  const stopMap = new Map(), noLoc = [];
  rem.forEach(x=>{
    const c = locOf(x.ln.c);
    if(!c){ noLoc.push(x); return; }
    const k = c.f+'|'+c.ut+'|'+c.uno;
    let st = stopMap.get(k);
    if(!st){
      st = { key:k, f:c.f, ut:c.ut, uno:c.uno, unit:unitAt(c.f,c.ut,c.uno), items:[] };
      stopMap.set(k, st);
    }
    st.items.push(x);
  });
  const stops = Array.from(stopMap.values());
  stops.forEach(s => s.items.sort((a,b)=> (S.cat[a.ln.c].ti||0) - (S.cat[b.ln.c].ti||0)));

  // 층별 묶기
  const byF = new Map();
  stops.forEach(s=>{ if(!byF.has(s.f)) byF.set(s.f, []); byF.get(s.f).push(s); });

  const order = floorOrder(Array.from(byF.keys()));
  const route = [];
  let entry = null;
  order.forEach((f, fi)=>{
    const list = byF.get(f);
    const stair = S.units.find(u=>u.f===f && u.t==='계단');
    const start = entry || (stair ? ctr(stair) : (list[0].unit ? ctr(list[0].unit) : [0,0]));
    const back = fi < order.length-1 && stair ? ctr(stair) : null;
    const seq = orderStops(list, start, back);
    seq.forEach(s => route.push(s));
    entry = stair ? ctr(stair) : (seq.length && seq[seq.length-1].unit ? ctr(seq[seq.length-1].unit) : start);
  });
  noLoc.forEach(x=> route.push({ key:'?'+x.ln.c, f:'?', ut:'', uno:'', unit:null, items:[x], unknown:true }));
  return { route, floors:order, noLoc };
}
function floorOrder(fs){
  if(!fs.length) return [];
  const idx = f => S.floors.indexOf(f);
  const cur = S.floors.indexOf(S.cur.f) < 0 ? 0 : S.floors.indexOf(S.cur.f);
  const v = fs.slice().sort((a,b)=> idx(a)-idx(b));
  const lo = idx(v[0]), hi = idx(v[v.length-1]);
  // 아래 먼저 훑고 위로 / 위 먼저 훑고 아래로 중 이동량이 적은 쪽
  const downFirst = Math.abs(cur-lo) + (hi-lo);
  const upFirst   = Math.abs(hi-cur) + (hi-lo);
  if(downFirst <= upFirst){
    const below = v.filter(f=>idx(f)<=cur).sort((a,b)=>idx(b)-idx(a));
    const above = v.filter(f=>idx(f)>cur).sort((a,b)=>idx(a)-idx(b));
    return below.concat(above);
  }
  const above = v.filter(f=>idx(f)>=cur).sort((a,b)=>idx(a)-idx(b));
  const below = v.filter(f=>idx(f)<cur).sort((a,b)=>idx(b)-idx(a));
  return above.concat(below);
}
function orderStops(list, start, back){
  const pts = list.map(s => s.unit ? ctr(s.unit) : null);
  // 좌표 없는 매대는 뒤로 밀되 번호순 유지
  const known = list.filter((s,i)=>pts[i]);
  const unknown = list.filter((s,i)=>!pts[i]).sort((a,b)=>a.uno.localeCompare(b.uno,undefined,{numeric:true}));
  if(known.length < 2) return known.concat(unknown);

  const P = known.map(s=>ctr(s.unit));
  const n = known.length;
  // 최근접 이웃
  const used = new Array(n).fill(false);
  let cur = start, seq = [];
  for(let k=0;k<n;k++){
    let best=-1, bd=Infinity;
    for(let i=0;i<n;i++) if(!used[i]){ const d=dist(cur,P[i]); if(d<bd){bd=d;best=i;} }
    used[best]=true; seq.push(best); cur=P[best];
  }
  // 2-opt
  const cost = sq => {
    let t = dist(start, P[sq[0]]);
    for(let i=0;i<sq.length-1;i++) t += dist(P[sq[i]], P[sq[i+1]]);
    if(back) t += dist(P[sq[sq.length-1]], back);
    return t;
  };
  let improved = true, guard = 0;
  while(improved && guard++ < 60){
    improved = false;
    for(let i=0;i<seq.length-1;i++){
      for(let j=i+1;j<seq.length;j++){
        const cand = seq.slice(0,i).concat(seq.slice(i,j+1).reverse(), seq.slice(j+1));
        if(cost(cand) < cost(seq) - 0.5){ seq = cand; improved = true; }
      }
    }
  }
  return seq.map(i=>known[i]).concat(unknown);
}

/* ==================== 피킹 화면 ==================== */
let RT = null;
function renderPick(){
  RT = buildRoute();
  const rem = remaining(), all = allLines();
  const doneN = all.length - rem.length;
  $('#pick-h').textContent = sessLabel(sess) + ' 피킹';
  $('#pick-sub').textContent = all.length
    ? (doneN + ' / ' + all.length + '줄 · ' + leftText())
    : '주문 탭에서 주문서를 담아주세요';
  $('#pick-prog').style.width = all.length ? (doneN/all.length*100)+'%' : '0%';
  const tn = $('#tab-n');
  tn.style.display = rem.length ? '' : 'none';
  tn.textContent = rem.length;

  const box = $('#pick-body');
  if(!all.length){
    box.innerHTML = '<div class="empty"><b>담긴 주문이 없습니다</b>'
      + '주문 탭에서 주문서 번호를 만들고<br>상품코드를 찍어 넣으세요.</div>'
      + '<button class="btn pri" id="go-ord">주문 담으러 가기</button>';
    $('#go-ord').onclick = ()=> go('v-order');
    return;
  }
  if(!rem.length){
    box.innerHTML = '<div class="empty" style="padding-top:50px"><div style="font-size:46px;margin-bottom:8px">✓</div>'
      + '<b>'+sessLabel(sess)+' 피킹 완료</b>'+all.length+'줄을 모두 집었습니다.</div>'
      + '<button class="btn gh" id="rev">되돌아보기</button>';
    $('#rev').onclick = showRemainList;
    return;
  }

  const st = RT.route[0];
  const nextStops = RT.route.slice(1, 9);
  const prevUnit = null;

  let h = '';
  h += '<div class="dest">';
  h += '<div class="step">다음 위치 · 남은 매대 '+RT.route.length+'곳</div>';
  if(st.unknown){
    h += '<div class="big"><em>위치 미지정</em></div>';
    h += '<div class="walk">앱에 위치가 없는 상품입니다. 상품 탭에서 위치를 채워주세요.</div>';
  } else {
    h += '<div class="big">'+esc(st.f)+' <em>·</em> '+esc(st.ut)+' '+esc(st.uno)+'</div>';
    if(!st.unit) h += '<div class="walk">평면도에 이 매대가 없어 순서가 대략적입니다</div>';
  }
  h += '<div class="picks">';
  st.items.forEach(x=>{
    const c = S.cat[x.ln.c] || {};
    h += '<div class="pk'+(x.ln.d?' done':'')+'" data-o="'+x.o.id+'" data-i="'+x.i+'">'
      + '<div class="bx">✓</div><div class="m">'
      + '<div class="nm">'+(c.ti?'<span class="tierbadge">'+c.ti+'면</span>':'')+esc(c.n||x.ln.c)+'</div>'
      + '<div class="sub">'+esc(x.ln.c)+' · 주문 '+esc(x.o.no)+'</div></div>'
      + '<div class="qty">'+(x.ln.q||1)+'</div></div>';
  });
  h += '</div>';
  h += '<button class="btn pri big" id="stop-done" style="margin-top:12px">이 자리 완료 · 다음으로</button>';
  h += '</div>';

  if(nextStops.length){
    h += '<div class="upnext">' + nextStops.map((s,i)=>
      '<div class="u'+(s.f!==st.f?' f':'')+'">'+(i+1)+'. '+esc(s.f)+' '+esc(abbr(s.ut))+esc(s.uno||'?')
      + ' <span style="color:var(--accent)">'+s.items.length+'</span></div>').join('') + '</div>';
  }
  if(!st.unknown && st.unit){
    h += '<div class="plancard"><svg class="plan" id="rmap" style="height:210px"></svg></div>';
  }
  box.innerHTML = h;

  $$('#pick-body .pk').forEach(el => el.onclick = ()=>{
    const o = S.orders.find(x=>x.id===el.dataset.o);
    const ln = o.l[+el.dataset.i];
    ln.d = !ln.d; save(); renderPick();
  });
  $('#stop-done').onclick = ()=>{
    st.items.forEach(x=>{ x.ln.d = true; });
    if(st.f !== '?') S.cur.f = st.f;
    save();
    renderPick();
  };
  if($('#rmap')) drawRoute($('#rmap'), st);
}
function drawRoute(svg, cur){
  const f = cur.f;
  const same = RT.route.filter(s=>s.f===f && s.unit);
  const pts = same.map(s=>ctr(s.unit));
  const box = fitBox(f);
  svg.setAttribute('viewBox', box.join(' '));
  let extra = '';
  if(pts.length > 1){
    extra += '<polyline points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="#C96442" '
          + 'stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round" opacity=".65"/>';
  }
  pts.forEach((p,i)=>{
    extra += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="'+(i===0?'#C96442':'#FFFFFF')+'" stroke="#C96442" stroke-width="2"/>'
          + '<text x="'+p[0]+'" y="'+p[1]+'" font-size="11" font-weight="700" text-anchor="middle" '
          + 'dominant-baseline="central" fill="'+(i===0?'#FFFFFF':'#C96442')+'">'+(i+1)+'</text>';
  });
  drawPlan(svg, f, {hi: cur.unit ? cur.unit.id : null, extra});
}
$('#pick-list').onclick = showRemainList;
function showRemainList(){
  const rem = remaining();
  if(!rem.length){ toast('남은 상품이 없습니다'); return; }
  const byOrd = {};
  rem.forEach(x=> (byOrd[x.o.no] = byOrd[x.o.no]||[]).push(x));
  let h = '<h2>남은 상품 '+rem.length+'줄</h2><p class="sh-sub">'+sessLabel(sess)+' · 주문서별</p>';
  Object.keys(byOrd).sort().forEach(no=>{
    h += '<div class="card"><h3>주문 '+esc(no)+' · '+byOrd[no].length+'줄</h3>';
    byOrd[no].forEach(x=>{
      const c = S.cat[x.ln.c]||{};
      h += '<div class="itm"><div class="txt"><div class="nm">'+esc(c.n||x.ln.c)+'</div>'
        + '<div class="mt">'+esc(locStr(c))+' · '+(x.ln.q||1)+'개</div></div></div>';
    });
    h += '</div>';
  });
  sheet(h);
}

/* ==================== 주문 화면 ==================== */
function renderOrders(){
  $('#ord-sess').innerHTML = ['am','pm'].map(s=>
    '<button class="chip'+(sess===s?' on':'')+'" data-s="'+s+'">'+sessLabel(s)+' '+S.times[s][0]+'~'+S.times[s][1]+'</button>').join('');
  $$('#ord-sess .chip').forEach(b=> b.onclick = ()=>{ sess = b.dataset.s; renderOrders(); renderPick(); });

  const os = sessOrders();
  const lines = os.reduce((a,o)=>a+o.l.length,0);
  $('#ord-sub').textContent = os.length ? (os.length+'건 · '+lines+'줄') : '주문서를 만들어 상품코드를 넣으세요';

  const box = $('#ord-body');
  const nOrd = Object.keys(ORD_SEED).length;
  const nLn = Object.values(ORD_SEED).reduce((a,x)=>a+x.length,0);
  const loadBtn = '<button class="btn gh" id="ord-seed" style="margin-top:6px">'
    + '올려주신 주문 '+nOrd+'건 불러오기<small style="display:block;font-size:12px;font-weight:450;opacity:.7;margin-top:2px">'
    + '9/2 주문서 0049~0068 · '+nLn+'줄</small></button>';
  if(!os.length){
    box.innerHTML = '<div class="empty"><b>'+sessLabel(sess)+' 주문이 없습니다</b>'
      + '우측 상단 + 주문서 를 눌러<br>주문서 번호(예: 0063)를 만드세요.</div>' + loadBtn;
    bindSeedBtn();
    return;
  }
  box.innerHTML = os.slice().reverse().map(o=>{
    const done = o.l.filter(l=>l.d).length;
    return '<div class="card"><h3 style="display:flex;align-items:center;gap:8px">주문 '+esc(o.no)
      + '<span class="badge'+(done===o.l.length&&o.l.length?'':' ac')+'">'+done+'/'+o.l.length+'</span>'
      + '<span style="flex:1"></span>'
      + '<button class="act" data-add="'+o.id+'" style="border:1px solid var(--border-strong);background:var(--surface);'
      + 'border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--accent)">+ 코드</button>'
      + '<button class="act" data-del="'+o.id+'" style="border:none;background:none;font-size:12.5px;color:var(--text-3);cursor:pointer;font-family:inherit">삭제</button>'
      + '</h3>'
      + (o.l.length ? o.l.map((ln,i)=>{
          const c = S.cat[ln.c]||{};
          return '<div class="itm"><div class="txt" data-e="'+o.id+':'+i+'"><div class="nm">'+esc(c.n||ln.c)+'</div>'
            + '<div class="mt">'+esc(ln.c)+' · '+esc(locStr(c))+'</div></div>'
            + '<div class="qty" style="font-size:16px;font-weight:700;color:var(--text-2);padding-right:4px">'+(ln.q||1)+'</div>'
            + '<button class="act" data-rm="'+o.id+':'+i+'">빼기</button></div>';
        }).join('') : '<p class="muted" style="margin:0">아직 담긴 상품이 없습니다.</p>')
      + '</div>';
  }).join('') + loadBtn;
  bindSeedBtn();
  $$('#ord-body [data-add]').forEach(b=> b.onclick = ()=> openCodeEntry(b.dataset.add));
  $$('#ord-body [data-del]').forEach(b=> b.onclick = ()=>{
    const o = S.orders.find(x=>x.id===b.dataset.del);
    if(!confirm('주문 '+o.no+' 을 삭제할까요?')) return;
    S.orders = S.orders.filter(x=>x.id!==o.id); save(); renderOrders(); renderPick();
  });
  $$('#ord-body [data-rm]').forEach(b=> b.onclick = ()=>{
    const [id,i] = b.dataset.rm.split(':');
    const o = S.orders.find(x=>x.id===id);
    o.l.splice(+i,1); save(); renderOrders(); renderPick();
  });
  $$('#ord-body [data-e]').forEach(b=> b.onclick = ()=>{
    const [id,i] = b.dataset.e.split(':');
    const o = S.orders.find(x=>x.id===id);
    openCat(o.l[+i].c);
  });
}
function bindSeedBtn(){
  const b = $('#ord-seed');
  if(!b) return;
  b.onclick = ()=>{
    let added=0, skipped=0;
    for(const no in ORD_SEED){
      if(S.orders.some(o=>o.no===no && o.s===sess)){ skipped++; continue; }
      S.orders.push({ id:uid(), no, s:sess, ts:Date.now(), l:ORD_SEED[no].map(([c,q])=>({c,q})) });
      added++;
    }
    save(); renderOrders(); renderPick();
    toast(added ? (sessLabel(sess)+'에 '+added+'건 불러왔습니다'+(skipped?' ('+skipped+'건은 이미 있음)':''))
                : '이미 모두 들어 있습니다');
  };
}
$('#ord-new').onclick = ()=>{
  sheet('<h2>주문서 추가</h2><p class="sh-sub">'+sessLabel(sess)+' 세션에 담깁니다</p>'

/* ---- 상품코드 연속 입력 ---- */
function openCodeEntry(orderId){
  const o = S.orders.find(x=>x.id===orderId);
  const draw = ()=>{
    sheet('<h2>주문 '+esc(o.no)+'</h2><p class="sh-sub">상품코드를 치고 확인을 누르면 계속 담깁니다</p>'
      + '<div class="row" style="margin-bottom:10px"><input id="cc" class="big-in" inputmode="numeric" '
      + 'placeholder="상품코드" autocomplete="off" style="flex:3"><div class="stepper" style="flex:1.1">'
      + '<button id="q-">&minus;</button><div class="v" id="qv">1</div><button id="q+">+</button></div></div>'
      + '<div id="cc-info" class="muted" style="min-height:40px;margin-bottom:10px"></div>'
      + '<button class="btn pri" id="cc-ok">담기</button>'
      + '<div class="card" style="margin-top:14px"><h3>담은 것 '+o.l.length+'줄</h3>'
      + (o.l.length ? o.l.slice().reverse().slice(0,8).map(ln=>{
          const c = S.cat[ln.c]||{};
          return '<div class="itm"><div class="txt"><div class="nm">'+esc(c.n||ln.c)+'</div>'
               + '<div class="mt">'+esc(locStr(c))+' · '+(ln.q||1)+'개</div></div></div>';
        }).join('') : '<p class="muted" style="margin:0">아직 없습니다.</p>')
      + '</div>'
      + '<button class="btn gh" id="cc-close" style="margin-top:6px">다 넣었습니다</button>');
    let q = 1;
    const setQ = v=>{ q = Math.max(1, Math.min(99, v)); $('#qv').textContent = q; };
    $('#q-').onclick = ()=>setQ(q-1); $('#q+').onclick = ()=>setQ(q+1);
    const info = ()=>{
      const code = ($('#cc').value||'').trim();
      const el = $('#cc-info');
      if(!code){ el.innerHTML = '코드 '+Object.keys(S.cat).length+'개를 기억하고 있습니다'; return; }
      const c = S.cat[code];
      el.innerHTML = c
        ? '<b style="color:var(--text);font-size:14.5px">'+esc(c.n)+'</b><br><span style="color:'
          + (c.uno?'var(--ok)':'var(--no)')+'">'+esc(locStr(c))+'</span>'
        : '<span style="color:var(--no)">처음 보는 코드입니다. 담으면 위치를 물어봅니다.</span>';
    };
    $('#cc').oninput = info; info();
    setTimeout(()=>$('#cc').focus(), 150);
    $('#cc').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#cc-ok').click(); } };
    $('#cc-ok').onclick = ()=>{
      const code = ($('#cc').value||'').trim();
      if(!code){ toast('상품코드를 입력해 주세요'); return; }
      const add = ()=>{
        const ex = o.l.find(l=>l.c===code);
        if(ex) ex.q = (ex.q||1) + q; else o.l.push({c:code, q});
        save(); renderOrders(); renderPick();
        const c = S.cat[code];
        toast((c?c.n:code) + ' 담음' + (c && c.uno ? ' · '+locStr(c) : ''));
        draw();
      };
      if(S.cat[code]) add();
      else openCat(code, ()=>{ add(); });
    };
    $('#cc-close').onclick = closeSheet;
  };
  draw();
}

/* ==================== 상품 카탈로그 ==================== */
let catFloor='all';
function renderCat(){
  const codes = Object.keys(S.cat);
  const noLoc = codes.filter(k=>!S.cat[k].uno).length;
  $('#cat-sub').textContent = codes.length + '개 기억 중' + (noLoc ? ' · 위치 없음 '+noLoc+'개' : '');
  $('#cat-chips').innerHTML = ['all'].concat(S.floors).concat(['none']).map(f=>
    '<button class="chip'+(catFloor===f?' on':'')+'" data-f="'+f+'">'
    + (f==='all'?'전체':f==='none'?'위치 없음':esc(f))+'</button>').join('');
  $$('#cat-chips .chip').forEach(b=> b.onclick = ()=>{ catFloor=b.dataset.f; renderCat(); });

  const kw = ($('#cq').value||'').trim().toLowerCase().replace(/\s+/g,'');
  let list = codes.map(k=>({k, c:S.cat[k]}));
  if(catFloor==='none') list = list.filter(x=>!x.c.uno);
  else if(catFloor!=='all') list = list.filter(x=>x.c.f===catFloor);
  if(kw) list = list.filter(x=> (x.c.n||'').toLowerCase().replace(/\s+/g,'').includes(kw) || x.k.includes(kw));
  list.sort((a,b)=>{
    const fa=S.floors.indexOf(a.c.f), fb=S.floors.indexOf(b.c.f);
    if(fa!==fb) return fa-fb;
    if(a.c.ut!==b.c.ut) return LOC_TYPES.indexOf(a.c.ut)-LOC_TYPES.indexOf(b.c.ut);
    return (a.c.uno||'').localeCompare(b.c.uno||'',undefined,{numeric:true});
  });
  $('#cat-body').innerHTML = list.length
    ? '<div class="card">'+list.slice(0,300).map(x=>
        '<div class="itm"><div class="txt" data-c="'+esc(x.k)+'"><div class="nm">'+esc(x.c.n||x.k)+'</div>'
        + '<div class="mt">'+esc(x.k)+' · '+esc(locStr(x.c))+'</div></div></div>').join('')+'</div>'
    : '<div class="empty"><b>해당하는 상품이 없습니다</b></div>';
  $$('#cat-body [data-c]').forEach(b=> b.onclick = ()=> openCat(b.dataset.c));
}
$('#cq').oninput = renderCat;
$('#cat-add').onclick = ()=> openCat('');

  const isNew = !S.cat[code];
  sheet('<h2>'+(isNew?'상품 등록':'상품 수정')+'</h2>'
    + '<p class="sh-sub">지시상품내역의 위치를 그대로 옮기면 됩니다</p>'
    + '<label class="fld"><span>상품코드</span><input id="k-code" value="'+esc(code)+'" inputmode="numeric"'
    + (code?' readonly style="background:var(--surface-2)"':'')+'></label>'
    + '<label class="fld"><span>상품명</span><input id="k-n" value="'+esc(c.n)+'" placeholder="예: 깨끗한나라 미니티슈 230매"></label>'
    + '<div class="row"><label class="fld"><span>층</span><select id="k-f">'
    + S.floors.map(f=>'<option'+(f===c.f?' selected':'')+'>'+esc(f)+'</option>').join('')+'</select></label>'
    + '<label class="fld"><span>구역</span><select id="k-ut">'
    + LOC_TYPES.map(t=>'<option'+(t===c.ut?' selected':'')+'>'+t+'</option>').join('')+'</select></label></div>'
    + '<div class="row"><label class="fld"><span>번호</span><input id="k-uno" value="'+esc(c.uno)+'" inputmode="numeric" placeholder="041" list="ul"></label>'
    + '<label class="fld"><span>면</span><input id="k-ti" value="'+(c.ti||'')+'" inputmode="numeric" placeholder="4"></label></div>'
    + '<datalist id="ul"></datalist>'
    + '<div id="k-warn" class="muted" style="margin:-4px 0 12px;min-height:18px"></div>'
    + '<button class="btn pri" id="k-ok">'+(isNew?'등록':'저장')+'</button>'
    + (isNew?'':'<button class="btn dg" id="k-del" style="margin-top:9px">삭제</button>'));
  const refresh = ()=>{
    const f=$('#k-f').value, t=$('#k-ut').value;
    const us = S.units.filter(u=>u.f===f&&u.t===t).sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true}));
    $('#ul').innerHTML = us.map(u=>'<option value="'+esc(u.no)+'">').join('');
    const v = ($('#k-uno').value||'').trim();
    const no = /^\d+$/.test(v)?pad3(parseInt(v,10)):v;
    const u = us.find(x=>x.no===no);
    const w = $('#k-warn');
    if(!v) w.innerHTML = us.length ? (f+' '+t+': '+us.map(x=>x.no).join(', ')) : ('평면도에 '+f+' '+t+'가 없습니다');
    else if(u) w.innerHTML = '<span style="color:var(--ok)">평면도에 있는 매대 · 최대 '+(u.tiers||1)+'면</span>';
    else w.innerHTML = '<span style="color:var(--no)">평면도에 없는 번호입니다. 저장은 되지만 동선 순서가 대략적입니다.</span>';
  };
  ['#k-f','#k-ut'].forEach(s=>$(s).onchange=refresh);
  $('#k-uno').oninput = refresh; refresh();
  setTimeout(()=>$(code?'#k-n':'#k-code').focus(), 150);
  $('#k-ok').onclick = ()=>{
    const k = ($('#k-code').value||'').trim();
    if(!k){ toast('상품코드를 입력해 주세요'); return; }
    const v = ($('#k-uno').value||'').trim();
    const uno = /^\d+$/.test(v)?pad3(parseInt(v,10)):v;
    const ti = parseInt(($('#k-ti').value||'').trim(),10);
    S.cat[k] = { n:($('#k-n').value||'').trim() || k, f:$('#k-f').value, ut:$('#k-ut').value,
                 uno, ti: isNaN(ti)?0:ti };
    save(); closeSheet(); renderCat(); renderOrders(); renderPick();
    if(after) after();
  };
  if(!isNew) $('#k-del').onclick = ()=>{
    if(!confirm('이 상품을 카탈로그에서 지울까요?')) return;
    delete S.cat[code]; save(); closeSheet(); renderCat(); renderPick();
  };
}

/* ==================== 평면도 ==================== */
function drawPlan(svg, floor, opt){
  opt = opt||{};
  const us = unitsOn(floor);
  let p = '';
  if(opt.grid){
    p += '<g stroke="#EFEDE4" stroke-width="1">';
    for(let x=0;x<=COLS;x++) p += '<line x1="'+(x*CELL)+'" y1="0" x2="'+(x*CELL)+'" y2="'+(ROWS*CELL)+'"/>';
    for(let y=0;y<=ROWS;y++) p += '<line x1="0" y1="'+(y*CELL)+'" x2="'+(COLS*CELL)+'" y2="'+(y*CELL)+'"/>';
    p += '</g>';
  }
  us.forEach(u=>{
    const X=u.x*CELL,Y=u.y*CELL,W=u.w*CELL,H=u.h*CELL;
    const sel=opt.sel===u.id, hi=opt.hi===u.id;
    p += '<g class="u" data-id="'+u.id+'">';
    p += '<rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" rx="3" fill="'+FILL[u.t]+'" stroke="'+
         (sel?'#1F1E1D':hi?'#C96442':LINE[u.t])+'" stroke-width="'+(sel||hi?3:1.5)+'"/>';
    const cx=X+W/2, cy=Y+H/2, vert=H>W*1.6;
    const fs=Math.max(10,Math.min(15,Math.min(W,H)*0.55));
    const lab = u.t==='계단' ? '계단' : u.no;
    p += '<text x="'+cx+'" y="'+cy+'" font-size="'+fs+'" font-weight="700" fill="'+LINE[u.t]+'" text-anchor="middle" '
       + 'dominant-baseline="central" style="pointer-events:none"'+(vert?' transform="rotate(-90 '+cx+' '+cy+')"':'')+'>'
       + esc(lab)+'</text>';
    p += '</g>';
  });
  if(opt.extra) p += opt.extra;
  if(!us.length && !opt.grid)
    p += '<text x="'+(COLS*CELL/2)+'" y="'+(ROWS*CELL/2)+'" font-size="18" fill="#8C8A82" text-anchor="middle">평면도가 비어 있습니다</text>';
  svg.innerHTML = p;
}
function fitBox(floor){
  const us = unitsOn(floor);
  if(!us.length) return [0,0,COLS*CELL,ROWS*CELL];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  us.forEach(u=>{x0=Math.min(x0,u.x);y0=Math.min(y0,u.y);x1=Math.max(x1,u.x+u.w);y1=Math.max(y1,u.y+u.h);});
  const m=2;
  let w=(x1-x0+m*2)*CELL, h=(y1-y0+m*2)*CELL;
  const R=1.35;
  if(w/h>R) h=w/R; else if(h/w>1/R*1.6) w=h*0.62;
  const cx=(x0+x1)/2*CELL, cy=(y0+y1)/2*CELL;
  return [cx-w/2, cy-h/2, w, h];
}
let edit=false, tool='선택', selId=null, VB=[0,0,COLS*CELL,ROWS*CELL];
let preview=null, pendNo='';
function bump(no){
  const n = parseInt(no,10);
  return isNaN(n) ? no : (/^\d+$/.test(no) ? pad3(n+1) : String(n+1));
}
function syncNumbar(){
  const on = edit && tool!=='선택' && tool!=='계단';
  $('#numbar').style.display = on ? '' : 'none';
  if(on) $('#n-val').value = pendNo;
}
$('#n-val').oninput = ()=>{ pendNo = ($('#n-val').value||'').trim(); };
$('#n-up').onclick = ()=>{ pendNo = bump(pendNo); syncNumbar(); };
$('#n-dn').onclick = ()=>{
  const n = parseInt(pendNo,10);
  if(!isNaN(n) && n>1) pendNo = /^\d+$/.test(pendNo) ? pad3(n-1) : String(n-1);
  syncNumbar();
};
function renderPlan(){
  const f = S.ui.floor;
  $('#plan-floors').innerHTML = S.floors.map(x=>
    '<button class="chip'+(x===f?' on':'')+'" data-f="'+esc(x)+'">'+esc(x)+'</button>').join('');
  $$('#plan-floors .chip').forEach(b=> b.onclick = ()=>{ S.ui.floor=b.dataset.f; selId=null; save(); fit(); renderPlan(); });
  const us = unitsOn(f), n = {};
  TYPES.forEach(t=> n[t]=us.filter(u=>u.t===t).length);
  $('#plan-sub').textContent = TYPES.filter(t=>n[t]).map(t=>t+' '+n[t]).join(' · ') || '아직 배치된 것이 없습니다';
  $('#toolbar').style.display = edit?'':'none';
  syncNumbar();
  if(!edit) $('#plan-hint').textContent = '';
  else if(tool==='선택') $('#plan-hint').textContent = '끌어 옮기고 · 톡 누르면 수정';
  else if(tool==='계단') $('#plan-hint').textContent = '층 이동 기준점입니다';
  else {
    const m = missingNos(f, tool);
    $('#plan-hint').innerHTML = m.length
      ? '주문에 나오는 <b style="color:var(--accent)">'+esc(tool)+'</b> 중 아직 안 놓은 번호<br>'
        + '<span style="font-variant-numeric:tabular-nums">' + m.slice(0,10).join(' ')
        + (m.length>10 ? ' 외 '+(m.length-10)+'개' : '') + '</span>'
      : '주문에 나오는 '+esc(tool)+'는 다 놓았습니다';
  }
  $('#plan-mode').textContent = edit?'완료':'편집';
  $('#plan-mode').className = 'btn '+(edit?'pri':'gh')+' sm';
  paint();
  const rows = TYPES.map(t=>{
    const l = us.filter(u=>u.t===t).sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true}));
    if(!l.length) return '';
    return '<div class="card"><h3 style="color:'+LINE[t]+'">'+t+' '+l.length+'개</h3><div class="chips">'
      + l.map(u=>'<button class="chip" data-u="'+u.id+'">'+esc(t==='계단'?'계단':u.no)+'</button>').join('')+'</div></div>';
  }).join('');
  $('#plan-legend').innerHTML = rows || '<div class="empty"><b>이 층의 평면도를 만들어 주세요</b>'
    + '편집을 누르고 곤도라·벽면·창고·계산대·계단을 놓으면<br>동선이 실제 거리로 계산됩니다.<br>'
    + '<b style="display:inline;font-size:14px">계단</b>을 꼭 하나 놓아주세요 — 층 이동 기준점입니다.</div>';
  $$('#plan-legend .chip').forEach(b=> b.onclick = ()=>{ edit=true; selId=b.dataset.u; renderPlan(); openUnitEdit(b.dataset.u); });
}
function paint(){
  const s=$('#svg'); s.setAttribute('viewBox',VB.join(' '));
  let extra='';
  if(preview){
    extra = '<rect x="'+(preview.x*CELL)+'" y="'+(preview.y*CELL)+'" width="'+(preview.w*CELL)
      + '" height="'+(preview.h*CELL)+'" rx="3" fill="'+FILL[preview.t]+'" fill-opacity=".75" stroke="'
      + LINE[preview.t]+'" stroke-width="2.5" stroke-dasharray="6 4" style="pointer-events:none"/>';
  }
  drawPlan(s,S.ui.floor,{grid:edit,sel:selId,extra});
}
function fit(){ VB = fitBox(S.ui.floor); }
$('#plan-mode').onclick = ()=>{ edit=!edit; selId=null; tool='선택'; preview=null; syncTools(); renderPlan(); };
function syncTools(){ $$('.tool').forEach(b=>b.classList.toggle('on',b.dataset.t===tool)); }
$$('.tool').forEach(b=> b.onclick = ()=>{
  tool=b.dataset.t; selId=null; preview=null;
  if(tool!=='선택') pendNo = suggestNo(S.ui.floor, tool);
  syncTools(); renderPlan();
});
$('#z-in').onclick=()=>zoom(0.8); $('#z-out').onclick=()=>zoom(1.25); $('#z-fit').onclick=()=>{fit();paint();};
function zoom(k){
  const cx=VB[0]+VB[2]/2, cy=VB[1]+VB[3]/2;
  VB[2]=Math.max(6*CELL,Math.min(COLS*CELL*1.5,VB[2]*k));
  VB[3]=Math.max(5*CELL,Math.min(ROWS*CELL*1.5,VB[3]*k));
  VB[0]=cx-VB[2]/2; VB[1]=cy-VB[3]/2; paint();
}
const svgEl = $('#svg');
let drag=null;
function toCell(ev){
  const r=svgEl.getBoundingClientRect(), sx=VB[2]/r.width, sy=VB[3]/r.height;
  const x=VB[0]+(ev.clientX-r.left)*sx, y=VB[1]+(ev.clientY-r.top)*sy;
  return {x,y,cx:Math.floor(x/CELL),cy:Math.floor(y/CELL),sx,sy};
}
svgEl.addEventListener('pointerdown', ev=>{
  const g=ev.target.closest('g.u'), p=toCell(ev);
  svgEl.setPointerCapture(ev.pointerId);
  if(!edit){ drag = g?{mode:'tap',id:g.dataset.id}:{mode:'pan',x0:ev.clientX,y0:ev.clientY,vb:VB.slice(),p}; return; }

  // 유닛 위에서 시작하면 어떤 도구가 켜져 있든 옮기기
  if(g){
    const u=S.units.find(x=>x.id===g.dataset.id);
    selId=u.id; paint();
    drag={mode:'move',id:u.id,ox:p.cx-u.x,oy:p.cy-u.y,moved:false,x0:ev.clientX,y0:ev.clientY};
    return;
  }
  // 빈 곳 + 도구 선택됨 → 놓기 (톡 = 기본 크기, 끌면 그 크기)
  if(tool!=='선택'){
    drag={mode:'create',sx:p.cx,sy:p.cy,moved:false,x0:ev.clientX,y0:ev.clientY};
    preview={x:Math.max(0,p.cx), y:Math.max(0,p.cy), w:1, h:1, t:tool};
    paint();
    return;
  }
  selId=null; paint(); drag={mode:'pan',x0:ev.clientX,y0:ev.clientY,vb:VB.slice(),p};
});
svgEl.addEventListener('pointermove', ev=>{
  if(!drag) return;
  if(drag.mode==='pan'){
    VB[0]=drag.vb[0]-(ev.clientX-drag.x0)*drag.p.sx;
    VB[1]=drag.vb[1]-(ev.clientY-drag.y0)*drag.p.sy; paint();
  } else if(drag.mode==='move'){
    if(Math.abs(ev.clientX-drag.x0)+Math.abs(ev.clientY-drag.y0)>6) drag.moved=true;
    const p=toCell(ev), u=S.units.find(x=>x.id===drag.id);
    const nx=Math.max(0,Math.min(COLS-u.w,p.cx-drag.ox)), ny=Math.max(0,Math.min(ROWS-u.h,p.cy-drag.oy));
    if(nx!==u.x||ny!==u.y){ u.x=nx; u.y=ny; paint(); }
  } else if(drag.mode==='create'){
    if(Math.abs(ev.clientX-drag.x0)+Math.abs(ev.clientY-drag.y0)>8) drag.moved=true;
    const p=toCell(ev);
    const x0=Math.max(0,Math.min(drag.sx,p.cx)), y0=Math.max(0,Math.min(drag.sy,p.cy));
    const x1=Math.min(COLS-1,Math.max(drag.sx,p.cx)), y1=Math.min(ROWS-1,Math.max(drag.sy,p.cy));
    preview={x:x0, y:y0, w:Math.max(1,x1-x0+1), h:Math.max(1,y1-y0+1), t:tool};
    paint();
  }
});
svgEl.addEventListener('pointerup', ev=>{
  if(!drag) return; const d=drag; drag=null;
  if(d.mode==='tap'){ openUnitInfo(d.id); return; }
  if(d.mode==='move'){ save(); if(!d.moved) openUnitEdit(d.id); else renderPlan(); return; }
  if(d.mode==='create'){
    const pv = preview; preview=null;
    if(!pv){ paint(); return; }
    placeUnit(pv.x, pv.y, d.moved?pv.w:DEF.w[tool], d.moved?pv.h:DEF.h[tool]);
  }
});

function nextNo(f,t){
  const ns=S.units.filter(u=>u.f===f&&u.t===t).map(u=>parseInt(u.no,10)).filter(n=>!isNaN(n));
  return pad3(ns.length?Math.max.apply(null,ns)+1:1);
}
/* 상품 카탈로그에 실제로 쓰이는 매대번호 */
function catNos(f,t){
  const s=new Set();
  for(const k in S.cat){ const c=S.cat[k]; if(c.f===f && c.ut===t && c.uno) s.add(c.uno); }
  return [...s].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
}
/* 그중 아직 평면도에 안 놓은 번호 */
function missingNos(f,t){
  return catNos(f,t).filter(n=>!S.units.some(u=>u.f===f&&u.t===t&&u.no===n));
}
/* 다음에 놓을 번호 추천: 카탈로그에 있는 미배치 번호 우선 */
function suggestNo(f,t){
  const m=missingNos(f,t);
  return m.length ? m[0] : nextNo(f,t);
}
function placeUnit(cx,cy,w,h){
  const f=S.ui.floor, t=tool;
  w=Math.max(1,w||DEF.w[t]); h=Math.max(1,h||DEF.h[t]);
  const x=Math.max(0,Math.min(COLS-w,cx)), y=Math.max(0,Math.min(ROWS-h,cy));
  let no = (t==='계단' || !pendNo) ? nextNo(f,t) : pendNo;
  if(S.units.some(u=>u.f===f&&u.t===t&&u.no===no)){
    toast(t+' '+no+' 은 이미 있습니다. 번호를 바꿔주세요.');
    paint(); return;
  }
  const u={id:uid(),f,t,no,x,y,w,h,tiers:DEF.tiers[t]};
  S.units.push(u);
  // 카탈로그에 남은 번호가 있으면 그걸, 없으면 다음 숫자
  const m = missingNos(f,t);
  pendNo = m.length ? m[0] : bump(no);
  save(); selId=u.id; renderPlan();
  toast(t+' '+no+' 놓음 · 톡 누르면 수정');
}
function openUnitInfo(id){
  const u=S.units.find(x=>x.id===id); if(!u) return;
  const here = Object.keys(S.cat).filter(k=>{ const c=S.cat[k]; return c.f===u.f&&c.ut===u.t&&c.uno===u.no; });
  const byTier={}; here.forEach(k=>{ const t=S.cat[k].ti||0; (byTier[t]=byTier[t]||[]).push(k); });
  let h='';

  }
  sheet('<h2>'+esc(u.f)+' '+esc(u.t)+' '+esc(u.t==='계단'?'':u.no)+'</h2>'

    + '<button class="btn gh" id="ui-edit" style="margin-top:12px">유닛 수정</button>');
  $('#ui-edit').onclick=()=>{ closeSheet(); edit=true; selId=u.id; renderPlan(); openUnitEdit(u.id); };

function openUnitEdit(id,isNew){
  const u=S.units.find(x=>x.id===id); if(!u) return;

  sheet('<h2>'+esc(u.t)+(isStair?'':' '+esc(u.no))+'</h2><p class="sh-sub">'+esc(u.f)+'</p>'

        + '<input id="e-no" value="'+esc(u.no)+'" inputmode="numeric" maxlength="6" class="big-in"></label>'
        + (miss.length
            ? '<div class="muted" style="margin:-4px 0 12px">주문에 나오는데 아직 안 놓은 번호 — 눌러서 넣기</div>'

    + (isStair||u.t==='계산대'?'':'<label class="fld"><span>면(단) 수 — 아래부터 1면</span><div class="stepper"><button data-a="t-">&minus;</button><div class="v" id="e-t">'+(u.tiers||1)+'</div><button data-a="t+">+</button></div></label>')

    if(a==='w+') u.w=Math.min(COLS-u.x,u.w+1); if(a==='w-') u.w=Math.max(1,u.w-1);
    if(a==='h+') u.h=Math.min(ROWS-u.y,u.h+1); if(a==='h-') u.h=Math.max(1,u.h-1);
    if(a==='t+') u.tiers=Math.min(20,(u.tiers||1)+1); if(a==='t-') u.tiers=Math.max(1,(u.tiers||1)-1);
    if(a==='rot'){ const t=u.w; u.w=Math.min(COLS-u.x,u.h); u.h=Math.min(ROWS-u.y,t); }
    save(); upd();
  });
  $('#e-ok').onclick=()=>{
    if(!isStair){
      const v=($('#e-no').value||'').trim();
      const no=/^\d+$/.test(v)?pad3(parseInt(v,10)):v;
      if(!no){ toast('번호를 입력해 주세요'); return; }
      if(S.units.some(x=>x!==u&&x.f===u.f&&x.t===u.t&&x.no===no)){ toast('같은 번호가 이미 있습니다'); return; }
      if(no!==u.no){
        Object.keys(S.cat).forEach(k=>{ const c=S.cat[k]; if(c.f===u.f&&c.ut===u.t&&c.uno===u.no) c.uno=no; });
        u.no=no;
      }
    }
    save(); closeSheet(); renderPlan(); renderPick();
  };
  $('#e-del').onclick=()=>{
    if(!confirm('이 유닛을 지울까요? (등록된 상품은 남습니다)')) return;

  };
}

function renderSet(){
  const codes=Object.keys(S.cat);
  const am=S.orders.filter(o=>o.s==='am'), pm=S.orders.filter(o=>o.s==='pm');
  const ln=o=>o.reduce((a,x)=>a+x.l.length,0);
  $('#set-stat').innerHTML =
    '<tr><td>평면도 유닛</td><td class="r">'+S.units.length+'</td></tr>'
   +'<tr><td>기억 중인 상품</td><td class="r">'+codes.length+'</td></tr>'
   +'<tr><td>위치 없는 상품</td><td class="r">'+codes.filter(k=>!S.cat[k].uno).length+'</td></tr>'
   +'<tr><td>오전 주문</td><td class="r">'+am.length+'건 · '+ln(am)+'줄</td></tr>'
   +'<tr><td>오후 주문</td><td class="r">'+pm.length+'건 · '+ln(pm)+'줄</td></tr>';
  $('#t-am1').value=S.times.am[0]; $('#t-am2').value=S.times.am[1];
  $('#t-pm1').value=S.times.pm[0]; $('#t-pm2').value=S.times.pm[1];
  $('#floor-mgr').innerHTML = S.floors.map(f=>
    '<div class="itm"><div class="txt"><div class="nm">'+esc(f)+'</div><div class="mt">유닛 '+unitsOn(f).length
    + ' · 상품 '+codes.filter(k=>S.cat[k].f===f).length+'</div></div>'
    + '<button class="act" data-df="'+esc(f)+'" style="color:var(--no);border-color:var(--no)">삭제</button></div>').join('');
  $$('#floor-mgr [data-df]').forEach(b=> b.onclick=()=>{
    const f=b.dataset.df;
    if(S.floors.length<=1){ toast('층은 하나 이상 있어야 합니다'); return; }
    if(!confirm(f+' 의 유닛과 상품 위치가 함께 지워집니다. 계속할까요?')) return;
    S.floors=S.floors.filter(x=>x!==f);
    S.units=S.units.filter(u=>u.f!==f);
    Object.keys(S.cat).forEach(k=>{ if(S.cat[k].f===f){ S.cat[k].f=''; S.cat[k].uno=''; } });
    if(S.ui.floor===f) S.ui.floor=S.floors[0];
    if(S.cur.f===f) S.cur.f=S.floors[0];
    save(); renderSet(); renderPick();
  });
}

$('#imp').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(o.cat && o.units){
        if(!confirm('불러오면 지금 데이터를 덮어씁니다.\n유닛 '+o.units.length+'개, 상품 '+Object.keys(o.cat).length+'개')) return;
        S=fill(o);
      } else if(o.units && o.items){
        if(!confirm('이전 매대 지도 백업입니다. 평면도와 상품을 가져올까요?')) return;
        const b=blank(); b.floors=o.floors||b.floors; b.units=o.units;
        (o.items||[]).forEach(it=>{ if(it.code) b.cat[it.code]={n:it.name,f:it.f,ut:it.ut,uno:it.uno,ti:it.tier||0}; });
        S=b;
      } else throw 0;
      save(); fit(); renderAll(); toast('불러왔습니다');
    }catch(e){ toast('백업 파일 형식이 아닙니다'); }
  };
  r.readAsText(f); ev.target.value='';
};
$('#wipe').onclick=()=>{

  if(!confirm('정말 지울까요? 백업은 받으셨나요?')) return;
  S=blank(); save(); fit(); renderAll(); toast('모두 지웠습니다');
};

function go(v){
  $$('.view').forEach(e=>e.classList.toggle('on',e.id===v));

  if(v==='v-pick') renderPick();

  if(v==='v-plan'){ fit(); renderPlan(); }

  if(v==='v-set') renderSet();
  window.scrollTo(0,0);
}
