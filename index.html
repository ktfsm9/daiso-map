<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매대지도">
<title>다이소 매대 지도</title>
<style>
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --surface-2:#F0EEE6; --surface-3:#E8E5DA;
  --border:#E5E2D9; --border-strong:#D6D2C4;
  --text:#1F1E1D; --text-2:#5C5B57; --text-3:#8C8A82;
  --accent:#C96442; --accent-soft:#F5E9E4; --accent-strong:#A94F32;
  --ok:#3F7D58; --ok-soft:#E6F0E9;
  --no:#B4453A; --no-soft:#F8E7E5;
  --gondola:#7C6BAF; --gondola-bg:#EDEAF6;
  --wall:#2F7DA8; --wall-bg:#E4F0F6;
  --store:#B07A2F; --store-bg:#F7EEDD;
  --cash:#3F7D58; --cash-bg:#E6F0E9;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overscroll-behavior:none;
}
.app{flex:1;display:flex;flex-direction:column;max-width:620px;width:100%;margin:0 auto;min-height:0}
.view{display:none;flex:1;flex-direction:column;min-height:0;padding:0 16px}
.view.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding-bottom:20px}

/* ---------- top ---------- */
.head{padding:14px 0 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.head h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.02em}
.head .sub{font-size:12.5px;color:var(--text-3);margin-top:1px}
.grow{flex:1}

/* ---------- tabbar ---------- */
.tabs{display:flex;border-top:1px solid var(--border);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0;z-index:40}
.tab{flex:1;border:none;background:none;padding:9px 4px 8px;font-family:inherit;
  font-size:11px;color:var(--text-3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.tab svg{width:22px;height:22px;stroke-width:1.7;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* ---------- controls ---------- */
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;
  padding:12px 13px;width:100%;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238C8A82' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:12.5px;color:var(--text-3);margin-bottom:5px;font-weight:500}
.row{display:flex;gap:9px}
.row > *{flex:1}

.btn{border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.13s;letter-spacing:-.01em;width:100%}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:active{background:var(--accent-strong)}
.btn.gh{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.btn.gh:active{background:var(--surface-2)}
.btn.dg{background:var(--no-soft);color:var(--no)}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);
  border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card h3{margin:0 0 11px;font-size:12.5px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.muted{color:var(--text-3);font-size:13px;line-height:1.65}
.empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:14px;line-height:1.7}
.empty b{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:6px}

/* ---------- search ---------- */
.searchbar{position:relative;margin-bottom:12px}
.searchbar input{padding:15px 44px 15px 15px;font-size:17px;border-radius:13px}
.searchbar .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border:none;background:none;color:var(--text-3);font-size:19px;cursor:pointer;border-radius:50%}

.res{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;cursor:pointer}
.res:active{background:var(--surface-2)}
.res .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.res .cd{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:2px}
.loc{display:inline-flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.lb{font-size:15px;font-weight:700;padding:5px 10px;border-radius:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lb.f{background:var(--surface-3);color:var(--text)}
.lb.곤도라{background:var(--gondola-bg);color:var(--gondola)}
.lb.벽면{background:var(--wall-bg);color:var(--wall)}
.lb.창고{background:var(--store-bg);color:var(--store)}
.lb.계산대{background:var(--cash-bg);color:var(--cash)}
.lb.t{background:var(--accent-soft);color:var(--accent-strong)}

/* ---------- plan ---------- */
.plancard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;position:relative;margin-bottom:11px}
svg.plan{display:block;width:100%;background:var(--surface);touch-action:none}
svg.plan.mini{touch-action:auto}
.planbar{display:flex;align-items:center;gap:7px;padding:9px 11px;border-top:1px solid var(--border);background:var(--surface-2)}
.zoom{width:34px;height:34px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);
  font-size:17px;cursor:pointer;color:var(--text-2);font-family:inherit;flex:none;display:grid;place-items:center}
.tool{flex:1;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:8px 4px;
  font-size:12px;font-family:inherit;cursor:pointer;color:var(--text-2);font-weight:600}
.tool.on{color:#fff}
.tool.on[data-t="선택"]{background:var(--text);border-color:var(--text)}
.tool.on[data-t="곤도라"]{background:var(--gondola);border-color:var(--gondola)}
.tool.on[data-t="벽면"]{background:var(--wall);border-color:var(--wall)}
.tool.on[data-t="창고"]{background:var(--store);border-color:var(--store)}
.tool.on[data-t="계산대"]{background:var(--cash);border-color:var(--cash)}

/* ---------- tiers ---------- */
.tiers{display:flex;flex-direction:column-reverse;gap:5px;margin-top:4px}
.tier{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.tier.hi{border-color:var(--accent);background:var(--accent-soft)}
.tier .n{font-size:12px;font-weight:700;color:var(--text-3);flex:none;min-width:30px;padding-top:2px}
.tier.hi .n{color:var(--accent-strong)}
.tier .c{flex:1;font-size:13.5px;line-height:1.55}
.tier .c em{font-style:normal;color:var(--text-3)}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(31,30,29,.32);z-index:60;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
  border-radius:20px 20px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.22,1,.36,1);
  max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;background:var(--border-strong);border-radius:9px;margin:6px auto 14px}
.sheet h2{font-size:17px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.sheet .sh-sub{font-size:13px;color:var(--text-3);margin:0 0 16px}

.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border-strong);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{width:42px;height:44px;border:none;background:var(--surface);font-size:19px;color:var(--text-2);cursor:pointer;font-family:inherit;flex:none}
.stepper button:active{background:var(--surface-2)}
.stepper .v{flex:1;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:180px;margin:0 auto}
.pad button{height:40px;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;
  font-size:15px;color:var(--text-2);cursor:pointer;font-family:inherit}
.pad button:active{background:var(--surface-2)}
.pad .sp{visibility:hidden}

/* ---------- list ---------- */
.itm{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.itm:last-child{border-bottom:none}
.itm .txt{flex:1;min-width:0}
.itm .nm{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itm .mt{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:2px}
.itm .ok{flex:none;border:1px solid var(--ok);color:var(--ok);background:var(--ok-soft);
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.toast{position:fixed;left:16px;right:16px;bottom:80px;z-index:70;background:var(--text);color:#fff;
  border-radius:12px;padding:12px 15px;font-size:13.5px;display:flex;align-items:center;gap:12px;
  max-width:560px;margin:0 auto;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{margin-left:auto;background:none;border:none;color:#F0B49A;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;flex:none}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-3);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
td.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
</style>
</head>
<body>
<div class="app">

<!-- ================= 검색 ================= -->
<section id="v-find" class="view on">
  <div class="head">
    <div><h1>매대 지도</h1><div class="sub" id="find-sub">상품이 어디 있는지 바로 찾기</div></div>
  </div>
  <div class="searchbar">
    <input type="search" id="q" placeholder="상품명 또는 상품코드" autocomplete="off" enterkeyhint="search">
    <button class="clr" id="q-clr" aria-label="지우기">&times;</button>
  </div>
  <div class="chips" id="find-chips" style="margin-bottom:12px"></div>
  <div class="scroll" id="find-res"></div>
</section>

<!-- ================= 평면도 ================= -->
<section id="v-plan" class="view">
  <div class="head">
    <div><h1>평면도</h1><div class="sub" id="plan-sub"></div></div>
    <div class="grow"></div>
    <button class="btn gh sm" id="plan-mode" style="width:auto">편집</button>
  </div>
  <div class="chips" id="plan-floors" style="margin-bottom:11px"></div>
  <div class="scroll">
    <div class="plancard">
      <svg class="plan" id="svg" viewBox="0 0 960 720" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="planbar" id="planbar">
        <button class="zoom" id="z-out">&minus;</button>
        <button class="zoom" id="z-in">+</button>
        <button class="zoom" id="z-fit" style="font-size:12px;font-weight:600">전체</button>
        <div class="grow"></div>
        <span class="muted" id="plan-hint">유닛을 누르면 상품이 보입니다</span>
      </div>
      <div class="planbar" id="toolbar" style="display:none">
        <button class="tool on" data-t="선택">선택</button>
        <button class="tool" data-t="곤도라">곤도라</button>
        <button class="tool" data-t="벽면">벽면</button>
        <button class="tool" data-t="창고">창고</button>
        <button class="tool" data-t="계산대">계산대</button>
      </div>
    </div>
    <div id="plan-legend"></div>
  </div>
</section>

<!-- ================= 상품 ================= -->
<section id="v-items" class="view">
  <div class="head">
    <div><h1>상품</h1><div class="sub" id="items-sub"></div></div>
    <div class="grow"></div>
    <button class="btn pri sm" id="items-add" style="width:auto">+ 추가</button>
  </div>
  <div class="searchbar" style="margin-bottom:10px">
    <input type="search" id="iq" placeholder="목록에서 찾기" autocomplete="off">
    <button class="clr" id="iq-clr" aria-label="지우기">&times;</button>
  </div>
  <div class="chips" id="items-chips" style="margin-bottom:11px"></div>
  <div class="scroll" id="items-list"></div>
</section>

<!-- ================= 설정 ================= -->
<section id="v-set" class="view">
  <div class="head"><div><h1>설정</h1><div class="sub">백업과 데이터 관리</div></div></div>
  <div class="scroll">
    <div class="card"><h3>현황</h3><table id="set-stat"></table></div>

    <div class="card">
      <h3>백업</h3>
      <p class="muted" style="margin:0 0 12px">입력한 평면도와 상품은 이 기기의 브라우저에만 저장됩니다.
        기기를 바꾸거나 사용 기록을 지우면 사라지니, 가끔 파일로 내려받아 두세요.</p>
      <button class="btn gh" id="exp" style="margin-bottom:9px">백업 파일 내려받기</button>
      <button class="btn gh" id="imp-btn">백업 파일 불러오기</button>
      <input type="file" id="imp" accept=".json,application/json" style="display:none">
    </div>

    <div class="card">
      <h3>최근 삭제 <span class="badge" id="trash-n">0</span></h3>
      <p class="muted" style="margin:0 0 10px">외웠다고 지운 상품 중 최근 50개입니다. 되돌릴 수 있습니다.</p>
      <div id="trash-list"></div>
    </div>

    <div class="card">
      <h3>층 관리</h3>
      <div id="floor-mgr"></div>
      <div class="row" style="margin-top:10px">
        <input id="new-floor" placeholder="예: 3F" maxlength="6">
        <button class="btn gh" id="add-floor" style="flex:0 0 90px">추가</button>
      </div>
    </div>

    <div class="card">
      <h3>전체 삭제</h3>
      <p class="muted" style="margin:0 0 11px">평면도와 상품을 모두 지웁니다. 되돌릴 수 없으니 먼저 백업하세요.</p>
      <button class="btn dg" id="wipe">모두 지우기</button>
    </div>
    <p class="muted" style="text-align:center;padding:6px 0 10px">다이소 구의역점 · 매대 지도</p>
  </div>
</section>

<!-- ================= tabs ================= -->
<nav class="tabs">
  <button class="tab on" data-v="v-find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>찾기</button>
  <button class="tab" data-v="v-plan"><svg viewBox="0 0 24 24"><path d="M3 5.5 9 3l6 2.5L21 3v15.5L15 21l-6-2.5L3 21z"/><path d="M9 3v15.5M15 5.5V21"/></svg>평면도</button>
  <button class="tab" data-v="v-items"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9h10M7 13h7"/></svg>상품</button>
  <button class="tab" data-v="v-set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>설정</button>
</nav>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-act">되돌리기</button></div>

<script>
/* ==================== 저장소 ==================== */
const KEY = 'daiso_map_v1';
const TYPES = ['곤도라','벽면','창고','계산대'];
const DEF = { w:{곤도라:1,벽면:1,창고:3,계산대:2}, h:{곤도라:4,벽면:5,창고:3,계산대:2}, tiers:{곤도라:5,벽면:5,창고:4,계산대:1} };
const COLS = 48, ROWS = 36, CELL = 20;

let S = load();
function load(){
  try{ const o = JSON.parse(localStorage.getItem(KEY)); if(o && o.units && o.items) return migrate(o); }catch(e){}
  return { v:1, floors:['B1','1F','1.5F','2F'], units:[], items:[], trash:[], ui:{floor:'1F'} };
}
function migrate(o){
  o.floors = o.floors || ['B1','1F','1.5F','2F'];
  o.trash = o.trash || []; o.ui = o.ui || {floor:o.floors[0]};
  return o;
}
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast('저장 공간이 부족합니다. 백업 후 정리해 주세요.'); }
  }, 60);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ==================== 유틸 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad3 = n => String(n).padStart(3,'0');
const pad2 = n => String(n).padStart(2,'0');

function unitOf(it){ return S.units.find(u => u.f===it.f && u.t===it.ut && u.no===it.uno); }
function unitsOn(f){ return S.units.filter(u => u.f===f); }
function itemsIn(u){ return S.items.filter(it => it.f===u.f && it.ut===u.t && it.uno===u.no); }
function locStr(it){ return it.f+'-'+it.ut+'-'+it.uno+(it.tier?'-'+pad2(it.tier):''); }
function locHTML(it){
  return '<span class="lb f">'+esc(it.f)+'</span><span class="lb '+it.ut+'">'+esc(it.ut)+' '+esc(it.uno)+'</span>'
       + (it.tier ? '<span class="lb t">'+it.tier+'면</span>' : '');
}

let toastT = null, toastFn = null;
function toast(msg, actLabel, fn){
  $('#toast-msg').textContent = msg;
  const b = $('#toast-act');
  b.style.display = fn ? '' : 'none';
  b.textContent = actLabel || '되돌리기';
  toastFn = fn || null;

/* ==================== 평면도 렌더 ==================== */
const FILL = {곤도라:'#EDEAF6',벽면:'#E4F0F6',창고:'#F7EEDD',계산대:'#E6F0E9'};
const LINE = {곤도라:'#7C6BAF',벽면:'#2F7DA8',창고:'#B07A2F',계산대:'#3F7D58'};

function drawPlan(svg, floor, opt){
  opt = opt || {};
  const us = unitsOn(floor);
  let p = '';

  if(opt.grid){
    p += '<g stroke="#EFEDE4" stroke-width="1">';
    for(let x=0;x<=COLS;x++) p += '<line x1="'+(x*CELL)+'" y1="0" x2="'+(x*CELL)+'" y2="'+(ROWS*CELL)+'"/>';
    for(let y=0;y<=ROWS;y++) p += '<line x1="0" y1="'+(y*CELL)+'" x2="'+(COLS*CELL)+'" y2="'+(y*CELL)+'"/>';
    p += '</g>';
  }
  us.forEach(u=>{
    const X=u.x*CELL, Y=u.y*CELL, W=u.w*CELL, H=u.h*CELL;
    const sel = opt.sel===u.id, hi = opt.hi===u.id;
    p += '<g class="u" data-id="'+u.id+'">';
    p += '<rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" rx="3" fill="'+FILL[u.t]+'" stroke="'+
         (sel?'#1F1E1D':hi?'#C96442':LINE[u.t])+'" stroke-width="'+(sel||hi?3:1.5)+'"/>';
    if(hi) p += '<rect x="'+(X-5)+'" y="'+(Y-5)+'" width="'+(W+10)+'" height="'+(H+10)+'" rx="7" fill="none" stroke="#C96442" stroke-width="2" stroke-dasharray="5 4"/>';
    const cx = X+W/2, cy = Y+H/2, vert = H > W*1.6;
    const fs = Math.max(10, Math.min(15, Math.min(W,H)*0.55));
    p += '<text x="'+cx+'" y="'+cy+'" font-size="'+fs+'" font-weight="700" fill="'+LINE[u.t]+'"'
       + ' text-anchor="middle" dominant-baseline="central" style="pointer-events:none"'
       + (vert?' transform="rotate(-90 '+cx+' '+cy+')"':'') + '>'+esc(u.no)+'</text>';
    p += '</g>';
  });
  if(!us.length && !opt.grid)
    p += '<text x="'+(COLS*CELL/2)+'" y="'+(ROWS*CELL/2)+'" font-size="18" fill="#8C8A82" text-anchor="middle">평면도가 비어 있습니다</text>';
  svg.innerHTML = p;
}

function fitBox(floor){
  const us = unitsOn(floor);
  if(!us.length) return [0,0,COLS*CELL,ROWS*CELL];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  us.forEach(u=>{ x0=Math.min(x0,u.x); y0=Math.min(y0,u.y); x1=Math.max(x1,u.x+u.w); y1=Math.max(y1,u.y+u.h); });
  const m = 2;
  let w = (x1-x0+m*2)*CELL, h = (y1-y0+m*2)*CELL;
  // 화면 비율(대략 4:3)보다 너무 납작하거나 길면 짧은 쪽을 늘려 여백을 고르게 둔다
  const R = 1.35;
  if(w/h > R) h = w/R; else if(h/w > 1/R*1.6) w = h*0.62;
  const cx = (x0+x1)/2*CELL, cy = (y0+y1)/2*CELL;
  return [cx-w/2, cy-h/2, w, h];
}

/* ==================== 평면도 화면 ==================== */
let edit = false, tool = '선택', selId = null, hiId = null;
let VB = [0,0,COLS*CELL,ROWS*CELL];

function renderPlanView(){
  const f = S.ui.floor;
  $('#plan-floors').innerHTML = S.floors.map(x =>
    '<button class="chip'+(x===f?' on':'')+'" data-f="'+esc(x)+'">'+esc(x)+'</button>').join('');
  $$('#plan-floors .chip').forEach(b => b.onclick = ()=>{
    S.ui.floor = b.dataset.f; selId = null; save(); fit(); renderPlanView();
  });
  const us = unitsOn(f);
  const n = {};
  TYPES.forEach(t => n[t] = us.filter(u=>u.t===t).length);
  $('#plan-sub').textContent = TYPES.filter(t=>n[t]).map(t=> t+' '+n[t]).join(' · ') || '아직 배치된 것이 없습니다';
  $('#toolbar').style.display = edit ? '' : 'none';
  $('#plan-hint').textContent = edit
    ? (tool==='선택' ? '유닛을 끌어 옮기세요' : '빈 칸을 누르면 '+tool+'가 놓입니다')
    : '유닛을 누르면 상품이 보입니다';
  $('#plan-mode').textContent = edit ? '완료' : '편집';
  $('#plan-mode').className = 'btn ' + (edit ? 'pri' : 'gh') + ' sm';
  paint();
  renderLegend();
}
function paint(){
  const svg = $('#svg');
  svg.setAttribute('viewBox', VB.join(' '));
  drawPlan(svg, S.ui.floor, {grid:edit, sel:selId, hi:hiId});
}
function fit(){ VB = fitBox(S.ui.floor); }

function renderLegend(){
  const us = unitsOn(S.ui.floor);
  if(!us.length){
    $('#plan-legend').innerHTML = '<div class="empty"><b>이 층의 평면도를 만들어 주세요</b>'
      + '우측 상단 <b style="display:inline;font-size:14px">편집</b>을 누른 뒤<br>곤도라·벽면·창고·계산대를 놓으면 됩니다.<br>'
      + '피난안내도를 보면서 대략의 위치만 맞춰도 충분합니다.</div>';
    return;
  }
  const rows = TYPES.map(t=>{
    const list = us.filter(u=>u.t===t).sort((a,b)=> a.no.localeCompare(b.no, undefined, {numeric:true}));
    if(!list.length) return '';
    return '<div class="card"><h3 style="color:'+LINE[t]+'">'+t+' '+list.length+'개</h3><div class="chips">'
      + list.map(u=>{
          const c = itemsIn(u).length;
          return '<button class="chip" data-u="'+u.id+'">'+esc(u.no)
            + (c?'<span style="color:var(--accent);margin-left:5px">'+c+'</span>':'')+'</button>';
        }).join('') + '</div></div>';
  }).join('');
  $('#plan-legend').innerHTML = rows;
  $$('#plan-legend .chip').forEach(b => b.onclick = ()=> openUnit(b.dataset.u));
}

$('#plan-mode').onclick = ()=>{ edit = !edit; selId = null; tool='선택'; syncTools(); renderPlanView(); };
function syncTools(){ $$('.tool').forEach(b => b.classList.toggle('on', b.dataset.t===tool)); }
$$('.tool').forEach(b => b.onclick = ()=>{ tool = b.dataset.t; selId = null; syncTools(); renderPlanView(); });
$('#z-in').onclick = ()=>{ zoom(0.8); };
$('#z-out').onclick = ()=>{ zoom(1.25); };
$('#z-fit').onclick = ()=>{ fit(); paint(); };
function zoom(k){
  const cx = VB[0]+VB[2]/2, cy = VB[1]+VB[3]/2;
  VB[2] = Math.max(6*CELL, Math.min(COLS*CELL*1.5, VB[2]*k));
  VB[3] = Math.max(5*CELL, Math.min(ROWS*CELL*1.5, VB[3]*k));
  VB[0] = cx-VB[2]/2; VB[1] = cy-VB[3]/2;
  paint();
}

/* ---- 포인터 조작 ---- */
const svgEl = $('#svg');
let drag = null;
function toCell(ev){
  const r = svgEl.getBoundingClientRect();
  const sx = VB[2]/r.width, sy = VB[3]/r.height;
  const x = VB[0] + (ev.clientX-r.left)*sx;
  const y = VB[1] + (ev.clientY-r.top)*sy;
  return { x, y, cx:Math.floor(x/CELL), cy:Math.floor(y/CELL), sx, sy };
}
svgEl.addEventListener('pointerdown', ev=>{
  const g = ev.target.closest('g.u');
  const p = toCell(ev);
  svgEl.setPointerCapture(ev.pointerId);

  if(!edit){
    drag = g ? {mode:'tapunit', id:g.dataset.id} : {mode:'pan', x0:ev.clientX, y0:ev.clientY, vb:VB.slice(), p};
    return;
  }
  if(tool !== '선택'){ drag = {mode:'place', cx:p.cx, cy:p.cy}; return; }
  if(g){
    const u = S.units.find(x=>x.id===g.dataset.id);
    selId = u.id; paint();
    drag = {mode:'move', id:u.id, ox:p.cx-u.x, oy:p.cy-u.y, moved:false, x0:ev.clientX, y0:ev.clientY};
  } else {
    selId = null; paint();
    drag = {mode:'pan', x0:ev.clientX, y0:ev.clientY, vb:VB.slice(), p};
  }
});
svgEl.addEventListener('pointermove', ev=>{
  if(!drag) return;
  if(drag.mode==='pan'){
    VB[0] = drag.vb[0] - (ev.clientX-drag.x0)*drag.p.sx;
    VB[1] = drag.vb[1] - (ev.clientY-drag.y0)*drag.p.sy;
    paint();
  } else if(drag.mode==='move'){
    if(Math.abs(ev.clientX-drag.x0)+Math.abs(ev.clientY-drag.y0) > 5) drag.moved = true;
    const p = toCell(ev);
    const u = S.units.find(x=>x.id===drag.id);
    const nx = Math.max(0, Math.min(COLS-u.w, p.cx-drag.ox));
    const ny = Math.max(0, Math.min(ROWS-u.h, p.cy-drag.oy));
    if(nx!==u.x || ny!==u.y){ u.x=nx; u.y=ny; paint(); }
  }
});
svgEl.addEventListener('pointerup', ev=>{
  if(!drag) return;
  const d = drag; drag = null;
  if(d.mode==='tapunit'){ openUnit(d.id); return; }
  if(d.mode==='place'){ placeUnit(d.cx, d.cy); return; }
  if(d.mode==='move'){ save(); if(!d.moved) openUnitEdit(d.id); else renderPlanView(); }
});
svgEl.addEventListener('pointercancel', ()=>{ drag = null; });

function nextNo(f, t){
  const ns = S.units.filter(u=>u.f===f && u.t===t).map(u=> parseInt(u.no,10)).filter(n=>!isNaN(n));
  return pad3(ns.length ? Math.max.apply(null, ns)+1 : 1);
}
function placeUnit(cx, cy){
  const f = S.ui.floor, t = tool;
  const w = DEF.w[t], h = DEF.h[t];
  const x = Math.max(0, Math.min(COLS-w, cx)), y = Math.max(0, Math.min(ROWS-h, cy));
  const u = { id:uid(), f, t, no:nextNo(f,t), x, y, w, h, tiers:DEF.tiers[t] };
  S.units.push(u); save();
  selId = u.id;
  renderPlanView();
  openUnitEdit(u.id, true);
}

/* ==================== 유닛 상세 ==================== */
function openUnit(id){
  const u = S.units.find(x=>x.id===id);
  if(!u) return;
  hiId = id; paint();
  const list = itemsIn(u);
  const byTier = {};
  list.forEach(it => { const k = it.tier||0; (byTier[k] = byTier[k]||[]).push(it); });
  let tiersHTML = '';
  for(let i=1;i<=(u.tiers||1);i++){
    const arr = byTier[i]||[];
    tiersHTML += '<div class="tier'+(arr.length?' hi':'')+'"><div class="n">'+i+'면</div><div class="c">'
      + (arr.length ? arr.map(it=> esc(it.name)).join('<br>') : '<em>비어 있음</em>') + '</div></div>';
  }
  const un = byTier[0]||[];
  if(un.length) tiersHTML += '<div class="tier"><div class="n">미지정</div><div class="c">'+un.map(it=>esc(it.name)).join('<br>')+'</div></div>';

  sheet(
    '<h2>'+esc(u.f)+' '+esc(u.t)+' '+esc(u.no)+'</h2>'
    + '<p class="sh-sub">등록된 상품 '+list.length+'개 · '+(u.tiers||1)+'면 (아래가 1면)</p>'
    + '<div class="tiers">'+tiersHTML+'</div>'
    + '<div class="row" style="margin-top:16px">'
    + '<button class="btn gh sm" id="u-add">여기에 상품 추가</button>'
    + '<button class="btn gh sm" id="u-edit">유닛 수정</button></div>'
  );
  $('#u-add').onclick = ()=>{ closeSheet(); openItemForm(null, {f:u.f, ut:u.t, uno:u.no}); };
  $('#u-edit').onclick = ()=>{ closeSheet(); edit = true; selId = u.id; renderPlanView(); openUnitEdit(u.id); };
}

function openUnitEdit(id, isNew){
  const u = S.units.find(x=>x.id===id);
  if(!u) return;
  sheet(
    '<h2>'+esc(u.t)+' '+esc(u.no)+'</h2>'
    + '<p class="sh-sub">'+esc(u.f)+' · 번호와 크기를 정해 주세요</p>'
    + '<label class="fld"><span>번호</span><input id="e-no" value="'+esc(u.no)+'" inputmode="numeric" maxlength="6"></label>'
    + '<div class="row"><label class="fld"><span>가로 칸</span><div class="stepper"><button data-a="w-">&minus;</button><div class="v" id="e-w">'+u.w+'</div><button data-a="w+">+</button></div></label>'
    + '<label class="fld"><span>세로 칸</span><div class="stepper"><button data-a="h-">&minus;</button><div class="v" id="e-h">'+u.h+'</div><button data-a="h+">+</button></div></label></div>'
    + (u.t==='계산대' ? '' :
       '<label class="fld"><span>면(단) 수 — 아래부터 1면</span><div class="stepper"><button data-a="t-">&minus;</button><div class="v" id="e-t">'+(u.tiers||1)+'</div><button data-a="t+">+</button></div></label>')
    + '<label class="fld"><span>위치 미세조정</span></label>'
    + '<div class="pad">'
    + '<button class="sp"></button><button data-a="up">↑</button><button class="sp"></button>'
    + '<button data-a="left">←</button><button data-a="rot">↻</button><button data-a="right">→</button>'
    + '<button class="sp"></button><button data-a="down">↓</button><button class="sp"></button></div>'
    + '<div style="margin-top:18px"><button class="btn pri" id="e-ok">'+(isNew?'놓기 완료':'저장')+'</button>'
    + '<button class="btn dg" id="e-del" style="margin-top:9px">이 유닛 삭제</button></div>'
  );
  const upd = ()=>{
    $('#e-w').textContent = u.w; $('#e-h').textContent = u.h;
    if($('#e-t')) $('#e-t').textContent = u.tiers||1;
    paint();
  };
  $('#sheet-body').querySelectorAll('[data-a]').forEach(b => b.onclick = ()=>{
    const a = b.dataset.a;
    if(a==='w+') u.w = Math.min(COLS-u.x, u.w+1);
    if(a==='w-') u.w = Math.max(1, u.w-1);
    if(a==='h+') u.h = Math.min(ROWS-u.y, u.h+1);
    if(a==='h-') u.h = Math.max(1, u.h-1);
    if(a==='t+') u.tiers = Math.min(12, (u.tiers||1)+1);
    if(a==='t-') u.tiers = Math.max(1, (u.tiers||1)-1);
    if(a==='up') u.y = Math.max(0, u.y-1);
    if(a==='down') u.y = Math.min(ROWS-u.h, u.y+1);
    if(a==='left') u.x = Math.max(0, u.x-1);
    if(a==='right') u.x = Math.min(COLS-u.w, u.x+1);
    if(a==='rot'){ const t=u.w; u.w=Math.min(COLS-u.x,u.h); u.h=Math.min(ROWS-u.y,t); }
    save(); upd();
  });
  $('#e-ok').onclick = ()=>{
    const v = ($('#e-no').value||'').trim();
    const no = /^\d+$/.test(v) ? pad3(parseInt(v,10)) : v;
    if(!no){ toast('번호를 입력해 주세요'); return; }
    const dup = S.units.find(x=> x!==u && x.f===u.f && x.t===u.t && x.no===no);
    if(dup){ toast('같은 번호가 이미 있습니다'); return; }
    if(no !== u.no){
      S.items.forEach(it=>{ if(it.f===u.f && it.ut===u.t && it.uno===u.no) it.uno = no; });
      u.no = no;
    }
    save(); closeSheet(); renderPlanView();
  };
  $('#e-del').onclick = ()=>{
    const n = itemsIn(u).length;
    if(!confirm(n ? ('이 유닛에 상품 '+n+'개가 등록돼 있습니다. 유닛만 지울까요? (상품은 남습니다)') : '이 유닛을 지울까요?')) return;
    S.units = S.units.filter(x=>x.id!==u.id);
    selId = null; save(); closeSheet(); renderPlanView();
  };
}

/* ==================== 상품 폼 ==================== */

    + '<label class="fld"><span>상품코드 (선택)</span><input id="i-code" value="'+esc(cur.code)+'" inputmode="numeric" placeholder="예: 1031913"></label>'

    + '</div>'
    + '<div class="row">'
    + '<label class="fld"><span>번호</span><input id="i-uno" value="'+esc(cur.uno)+'" inputmode="numeric" placeholder="041" list="uno-list"></label>'
    + '<label class="fld"><span>면 (아래부터 1면)</span><input id="i-tier" value="'+(cur.tier||'')+'" inputmode="numeric" placeholder="4"></label>'
    + '</div><datalist id="uno-list"></datalist>'
    + '<div id="i-warn" class="muted" style="margin:-4px 0 12px;min-height:18px"></div>'

    $('#uno-list').innerHTML = us.map(u=>'<option value="'+esc(u.no)+'">').join('');

    const no = /^\d+$/.test(v) ? pad3(parseInt(v,10)) : v;
    const u = us.find(x=>x.no===no);

    if(!v) w.innerHTML = us.length ? '이 층 '+t+': '+us.map(x=>x.no).join(', ') : '평면도에 '+t+'가 아직 없습니다';
    else if(u) w.innerHTML = '<span style="color:var(--ok)">평면도에 있는 '+esc(u.no)+'번 · 최대 '+(u.tiers||1)+'면</span>';
    else w.innerHTML = '<span style="color:var(--no)">평면도에 없는 번호입니다. 저장은 되지만 지도에 표시되지 않습니다.</span>';
  };
  ['#i-f','#i-ut'].forEach(s => $(s).onchange = refresh);
  $('#i-uno').oninput = refresh;
  refresh();

  $('#i-ok').onclick = ()=>{

    const v = ($('#i-uno').value||'').trim();
    const uno = /^\d+$/.test(v) ? pad3(parseInt(v,10)) : v;
    if(!uno){ toast('번호를 입력해 주세요'); return; }
    const tierV = parseInt(($('#i-tier').value||'').trim(),10);
    const rec = {
      id: it ? it.id : uid(),
      name, code: ($('#i-code').value||'').trim(),
      f: $('#i-f').value, ut: $('#i-ut').value, uno,

}

function removeItem(id, msg){
  const i = S.items.findIndex(x=>x.id===id);
  if(i<0) return;
  const [it] = S.items.splice(i,1);
  S.trash.unshift(Object.assign({}, it, {del:Date.now()}));
  S.trash = S.trash.slice(0,50);
  save();
  toast(msg || ('외웠습니다 · ' + it.name), '되돌리기', ()=>{
    S.trash = S.trash.filter(x=>x.id!==it.id);
    S.items.unshift(it); save(); renderItems(); renderFind(); renderSet();
  });
  renderItems(); renderFind();
}

$('#items-add').onclick = ()=> openItemForm(null);

/* ==================== 찾기 ==================== */
let findFloor = 'all';
function matches(list, kw){
  if(!kw) return list;
  const k = kw.toLowerCase().replace(/\s+/g,'');
  return list.filter(it =>
    it.name.toLowerCase().replace(/\s+/g,'').includes(k) ||
    (it.code||'').includes(kw.trim()) ||
    locStr(it).toLowerCase().includes(k));
}
function renderFind(){
  const kw = ($('#q').value||'').trim();
  $('#find-sub').textContent = S.items.length ? ('등록된 상품 '+S.items.length+'개') : '먼저 상품을 등록해 주세요';
  $('#find-chips').innerHTML = ['all'].concat(S.floors).map(f=>
    '<button class="chip'+(findFloor===f?' on':'')+'" data-f="'+esc(f)+'">'+(f==='all'?'전체':esc(f))+'</button>').join('');
  $$('#find-chips .chip').forEach(b => b.onclick = ()=>{ findFloor = b.dataset.f; renderFind(); });

  let list = S.items;
  if(findFloor!=='all') list = list.filter(it=>it.f===findFloor);
  list = matches(list, kw);

  const box = $('#find-res');
  if(!S.items.length){
    box.innerHTML = '<div class="empty"><b>아직 등록된 상품이 없습니다</b>'
      + '상품 탭에서 추가하거나,<br>평면도에서 유닛을 누르고 추가하세요.</div>';
    return;
  }
  if(!list.length){
    box.innerHTML = '<div class="empty"><b>찾는 상품이 없습니다</b>'
      + (kw ? '"'+esc(kw)+'" 와 맞는 상품이 없습니다.<br>새로 등록하시겠어요?' : '')
      + (kw ? '<div style="margin-top:16px"><button class="btn gh sm" id="quick-add" style="width:auto;display:inline-block">"'+esc(kw)+'" 추가하기</button></div>' : '')
      + '</div>';
    if($('#quick-add')) $('#quick-add').onclick = ()=>{
      openItemForm(null);
      setTimeout(()=>{ const n=$('#i-name'); if(n) n.value = kw; }, 150);
    };
    return;
  }
  const show = kw ? list.slice(0,40) : list.slice(0,25);
  box.innerHTML = show.map(it=>{
    const u = unitOf(it);
    return '<div class="res" data-id="'+it.id+'">'
      + '<div class="nm">'+esc(it.name)+'</div>'
      + (it.code ? '<div class="cd">'+esc(it.code)+'</div>' : '')
      + '<div class="loc">'+locHTML(it)+'</div>'
      + (u ? '' : '<div class="cd" style="color:var(--no);margin-top:6px">평면도에 없는 번호</div>')
      + '</div>';
  }).join('') + (list.length>show.length ? '<p class="muted" style="text-align:center;padding:8px">외 '+(list.length-show.length)+'개 더 있습니다</p>' : '');
  $$('#find-res .res').forEach(el => el.onclick = ()=> showOnMap(el.dataset.id));
}
function showOnMap(id){
  const it = S.items.find(x=>x.id===id);
  if(!it) return;
  const u = unitOf(it);
  if(!u){
    sheet('<h2>'+esc(it.name)+'</h2><p class="sh-sub">'+locStr(it)+'</p>'
      + '<div class="muted" style="margin-bottom:16px">이 번호는 평면도에 아직 없습니다. 평면도 탭에서 '
      + esc(it.f)+' '+esc(it.ut)+' '+esc(it.uno)+'을 배치하면 지도에 표시됩니다.</div>'
      + '<button class="btn gh" id="s-edit">상품 수정</button>');
    $('#s-edit').onclick = ()=>{ closeSheet(); openItemForm(it.id); };
    return;
  }
  const box = fitBox(it.f);
  const cx = (u.x+u.w/2)*CELL, cy = (u.y+u.h/2)*CELL;
  const w = Math.min(box[2], 22*CELL), h = w*0.72;
  const vb = [cx-w/2, cy-h/2, w, h];
  let tiersHTML = '';
  for(let i=1;i<=(u.tiers||1);i++)
    tiersHTML += '<div class="tier'+(i===it.tier?' hi':'')+'"><div class="n">'+i+'면</div><div class="c">'
      + (i===it.tier ? '<b>'+esc(it.name)+'</b>' : '<em>—</em>') + '</div></div>';

  sheet(
    '<h2>'+esc(it.name)+'</h2>'
    + '<p class="sh-sub">'+(it.code?esc(it.code)+' · ':'')+'등록 위치</p>'
    + '<div class="loc" style="margin-bottom:14px">'+locHTML(it)+'</div>'
    + '<div class="plancard"><svg class="plan mini" id="mini" viewBox="'+vb.join(' ')+'" style="height:190px"></svg></div>'
    + (it.tier ? '<div class="tiers" style="margin-bottom:14px">'+tiersHTML+'</div>' : '')
    + '<div class="row"><button class="btn gh sm" id="s-edit">수정</button>'
    + '<button class="btn gh sm" id="s-done" style="color:var(--ok);border-color:var(--ok)">외웠어요</button></div>'
  );
  drawPlan($('#mini'), it.f, {hi:u.id});
  $('#s-edit').onclick = ()=>{ closeSheet(); openItemForm(it.id); };
  $('#s-done').onclick = ()=>{ closeSheet(); removeItem(it.id); };
}
$('#q').oninput = renderFind;
$('#q-clr').onclick = ()=>{ $('#q').value=''; renderFind(); $('#q').focus(); };

/* ==================== 상품 목록 ==================== */
let itemFloor = 'all';
function renderItems(){
  $('#items-sub').textContent = S.items.length ? (S.items.length+'개 등록 · 외운 것은 지우세요') : '지시상품내역을 보며 추가하세요';
  $('#items-chips').innerHTML = ['all'].concat(S.floors).map(f=>
    '<button class="chip'+(itemFloor===f?' on':'')+'" data-f="'+esc(f)+'">'+(f==='all'?'전체':esc(f))+'</button>').join('');
  $$('#items-chips .chip').forEach(b => b.onclick = ()=>{ itemFloor = b.dataset.f; renderItems(); });

  let list = S.items.slice();
  if(itemFloor!=='all') list = list.filter(it=>it.f===itemFloor);
  list = matches(list, ($('#iq').value||'').trim());
  list.sort((a,b)=>{
    const fa = S.floors.indexOf(a.f), fb = S.floors.indexOf(b.f);
    if(fa!==fb) return fa-fb;
    if(a.ut!==b.ut) return TYPES.indexOf(a.ut)-TYPES.indexOf(b.ut);
    return a.uno.localeCompare(b.uno, undefined, {numeric:true});
  });

  const box = $('#items-list');
  if(!list.length){
    box.innerHTML = '<div class="empty"><b>'+(S.items.length?'해당하는 상품이 없습니다':'등록된 상품이 없습니다')+'</b>'
      + '우측 상단 + 추가 를 눌러 등록하세요.</div>';
    return;
  }
  box.innerHTML = '<div class="card">' + list.map(it=>
    '<div class="itm"><div class="txt" data-e="'+it.id+'">'
    + '<div class="nm">'+esc(it.name)+'</div>'
    + '<div class="mt">'+esc(locStr(it))+(it.code?' · '+esc(it.code):'')+'</div></div>'
    + '<button class="ok" data-d="'+it.id+'">외웠어요</button></div>').join('') + '</div>';
  $$('#items-list [data-e]').forEach(el => el.onclick = ()=> openItemForm(el.dataset.e));
  $$('#items-list [data-d]').forEach(el => el.onclick = ()=> removeItem(el.dataset.d));
}
$('#iq').oninput = renderItems;
$('#iq-clr').onclick = ()=>{ $('#iq').value=''; renderItems(); };

/* ==================== 설정 ==================== */
function renderSet(){
  const byF = S.floors.map(f=>{
    const u = unitsOn(f).length, i = S.items.filter(x=>x.f===f).length;
    return '<tr><td>'+esc(f)+'</td><td class="r">유닛 '+u+'</td><td class="r">상품 '+i+'</td></tr>';
  }).join('');
  $('#set-stat').innerHTML = byF
    + '<tr><td><b>합계</b></td><td class="r"><b>'+S.units.length+'</b></td><td class="r"><b>'+S.items.length+'</b></td></tr>';

  $('#trash-n').textContent = S.trash.length;
  $('#trash-list').innerHTML = S.trash.length
    ? S.trash.slice(0,12).map(it=>
        '<div class="itm"><div class="txt"><div class="nm">'+esc(it.name)+'</div>'
        + '<div class="mt">'+esc(locStr(it))+'</div></div>'
        + '<button class="ok" data-r="'+it.id+'" style="color:var(--accent);border-color:var(--accent);background:var(--accent-soft)">되살리기</button></div>').join('')
    : '<p class="muted" style="margin:0">아직 없습니다.</p>';
  $$('#trash-list [data-r]').forEach(b => b.onclick = ()=>{
    const it = S.trash.find(x=>x.id===b.dataset.r);
    if(!it) return;
    S.trash = S.trash.filter(x=>x.id!==it.id);
    delete it.del;
    S.items.unshift(it); save(); renderSet(); renderItems(); renderFind();
    toast('되살렸습니다');
  });

  $('#floor-mgr').innerHTML = S.floors.map(f=>
    '<div class="itm"><div class="txt"><div class="nm">'+esc(f)+'</div>'
    + '<div class="mt">유닛 '+unitsOn(f).length+' · 상품 '+S.items.filter(x=>x.f===f).length+'</div></div>'
    + '<button class="ok" data-df="'+esc(f)+'" style="color:var(--no);border-color:var(--no);background:var(--no-soft)">삭제</button></div>').join('');
  $$('#floor-mgr [data-df]').forEach(b => b.onclick = ()=>{
    const f = b.dataset.df;
    if(S.floors.length<=1){ toast('층은 하나 이상 있어야 합니다'); return; }
    const n = unitsOn(f).length + S.items.filter(x=>x.f===f).length;
    if(n && !confirm(f+' 의 유닛/상품 '+n+'개가 함께 지워집니다. 계속할까요?')) return;
    S.floors = S.floors.filter(x=>x!==f);
    S.units = S.units.filter(u=>u.f!==f);
    S.items = S.items.filter(i=>i.f!==f);
    if(S.ui.floor===f) S.ui.floor = S.floors[0];
    save(); renderSet();
  });
}
$('#add-floor').onclick = ()=>{
  const v = ($('#new-floor').value||'').trim();
  if(!v) return;
  if(S.floors.includes(v)){ toast('이미 있는 층입니다'); return; }
  S.floors.push(v); $('#new-floor').value=''; save(); renderSet();
  toast(v+' 층을 추가했습니다');
};

$('#exp').onclick = ()=>{
  const d = new Date();
  const stamp = d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes());
  const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'daiso-map-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('백업 파일을 내려받았습니다');
};
$('#imp-btn').onclick = ()=> $('#imp').click();
$('#imp').onchange = ev=>{
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!o.units || !o.items) throw 0;
      if(!confirm('백업을 불러오면 지금 데이터를 덮어씁니다.\n유닛 '+o.units.length+'개, 상품 '+o.items.length+'개를 불러올까요?')) return;
      S = migrate(o); save();
      fit(); renderSet(); renderItems(); renderFind(); renderPlanView();
      toast('불러왔습니다');
    }catch(e){ toast('백업 파일 형식이 아닙니다'); }
  };
  r.readAsText(f);
  ev.target.value = '';
};
$('#wipe').onclick = ()=>{
  if(!confirm('평면도와 상품을 모두 지웁니다. 되돌릴 수 없습니다.\n계속할까요?')) return;
  if(!confirm('정말 지울까요? 백업은 받으셨나요?')) return;
  S = { v:1, floors:['B1','1F','1.5F','2F'], units:[], items:[], trash:[], ui:{floor:'1F'} };
  save(); fit(); renderSet(); renderItems(); renderFind(); renderPlanView();
  toast('모두 지웠습니다');
};

/* ==================== 시작 ==================== */
if(!S.floors.includes(S.ui.floor)) S.ui.floor = S.floors[0];
fit();
renderFind();
</script>
</body>
</html>
